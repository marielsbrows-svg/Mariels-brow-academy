<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brow Mapping Practice | Mariels Brow Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --soft:#1C1C1C; --mute:#9A9A9A; --line:#D4D4D4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#FFFFFF; --soft:#D4D4D4; --mute:#9A9A9A; --line:#2E2E2E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --soft:#D4D4D4; --mute:#9A9A9A; --line:#2E2E2E;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px)}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-weight:300; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.top{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  max-width:1180px; margin:0 auto; padding:14px clamp(16px,4vw,40px);
}
.wordmark{font-family:"Bebas Neue", Impact, "Arial Narrow", sans-serif; font-size:22px; letter-spacing:.06em; line-height:1}
.lang,.toggle{display:inline-flex; border:1px solid var(--line)}
.lang button,.toggle button{
  font:inherit; font-size:13px; font-weight:400; background:none; border:0; color:var(--mute);
  padding:6px 14px; min-height:38px; cursor:pointer;
}
.lang button[aria-pressed="true"],.toggle button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.app{
  max-width:1180px; margin:0 auto; padding:4px clamp(16px,4vw,40px) 36px;
  display:grid; gap:24px;
}
@media (min-width:820px){
  .app{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr); gap:clamp(32px,5vw,72px); align-items:center; min-height:calc(100svh - 110px)}
}
.stage{
  width:100%; max-width:min(100%, 76svh); margin:0 auto; aspect-ratio:1/1;
  background:#FFFFFF; overflow:hidden;
}
@media (max-width:819px){ .stage{max-width:min(100%, 56svh)} }
#chart{display:block; width:100%; height:100%; outline:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.app.interactive #chart{touch-action:none; cursor:crosshair}
#chart:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}

.panel{max-width:440px; width:100%; margin:0 auto}
.meta{display:flex; justify-content:space-between; gap:12px; font-size:13px; font-weight:400; color:var(--mute); margin:0 0 8px}
h1{
  font-family:"Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight:400;
  font-size:clamp(46px,7vw,78px); line-height:.9; letter-spacing:.01em; margin:0 0 16px;
}
h2{font-size:13px; font-weight:400; color:var(--mute); margin:0 0 8px}
.progress{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 18px}
.progress span{height:2px; background:var(--line)}
.progress span.done{background:var(--ink)}
.progress span.now{background:var(--mute)}
.instr{font-size:17px; line-height:1.55; color:var(--soft); margin:0 0 8px; max-width:40ch}
.hint{font-size:13px; color:var(--mute); margin:0 0 18px; max-width:44ch}
.feedback{border-left:2px solid var(--ink); padding:2px 0 2px 14px; margin:0 0 20px}
.feedback strong{display:block; font-family:"Bebas Neue", Impact, sans-serif; font-weight:400; font-size:30px; line-height:1; letter-spacing:.02em}
.feedback p{margin:6px 0 0; font-size:15px; color:var(--soft)}
.nudges{display:flex; gap:10px; margin:0 0 20px}
.nudges button{
  width:50px; height:50px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  display:grid; place-items:center; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.nudges svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.facepick{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:0 0 24px}
.facepick button{
  font:inherit; background:var(--bg); color:var(--ink); border:1px solid var(--line); cursor:pointer;
  min-height:56px; padding:6px 0 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
}
.facepick b{font-family:"Bebas Neue", Impact, sans-serif; font-weight:400; font-size:24px; letter-spacing:.02em}
.facepick small{font-size:11px; color:var(--mute); margin-top:3px; min-height:11px}
.facepick button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.facepick button[aria-pressed="true"] small{color:var(--bg); opacity:.7}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:400; font-size:15px; letter-spacing:.02em; min-height:52px; padding:0 22px;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; border-radius:0; flex:1 1 auto;
}
.btn.ghost{background:transparent; color:var(--ink)}
.btn:disabled{opacity:.28; cursor:not-allowed}
.btn:focus-visible,.nudges button:focus-visible,.lang button:focus-visible,.toggle button:focus-visible,.facepick button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.score{display:flex; align-items:baseline; gap:10px; margin:0 0 6px}
.score b{font-family:"Bebas Neue", Impact, sans-serif; font-weight:400; font-size:clamp(80px,12vw,124px); line-height:.85}
.score span{color:var(--mute); font-size:14px}
.breakdown{list-style:none; padding:0; margin:0 0 22px; border-top:1px solid var(--line)}
.breakdown li{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px}
.breakdown b{font-weight:400}
.toggle{margin:4px 0 18px}


.sections{display:grid; gap:6px; margin:0 0 22px}
.sections button{
  font:inherit; text-align:left; background:var(--bg); color:var(--ink); border:1px solid var(--line); cursor:pointer;
  padding:12px 14px; display:block;
}
.sections b{display:block; font-family:"Bebas Neue", Impact, sans-serif; font-weight:400; font-size:24px; line-height:1; letter-spacing:.02em}
.sections small{display:block; font-size:13px; color:var(--mute); margin-top:4px}
.sections button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.sections button[aria-pressed="true"] small{color:var(--bg); opacity:.7}
.sections button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.choices{display:grid; gap:8px; margin:0 0 20px}
.choices .btn{flex:none; width:100%}
.btn.picked{background:var(--ink); color:var(--bg)}
.btn.picked:disabled,.btn.correct:disabled{opacity:1}
.btn.correct:not(.picked){border-width:2px}
.lbl circle{fill:#FFFFFF; stroke:#000000; stroke-width:1.2; vector-effect:non-scaling-stroke}
.lbl text{fill:#000000; font-family:Inter, system-ui, sans-serif; font-weight:400; text-anchor:middle; dominant-baseline:central}
.lbl.dim circle{fill:rgba(255,255,255,.8)}
html.embed .top{display:none}
html.embed .app{min-height:0; padding-top:clamp(16px,3vw,32px); padding-bottom:28px}
html.embed .stage{max-width:min(100%, 600px)}
@media (min-width:700px){
  html.embed .app{grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr); align-items:start}
}
html.embed h1{font-size:clamp(40px,6vw,64px)}
/* overlay on photo: white string with dark halo reads on every skin tone */
.halo{fill:none; stroke:rgba(0,0,0,.38); stroke-width:4.5; stroke-linecap:round; vector-effect:non-scaling-stroke}
.halo.light{stroke:rgba(255,255,255,.85); stroke-width:4}
.string{fill:none; stroke:#FFFFFF; stroke-width:2; stroke-linecap:round; vector-effect:non-scaling-stroke}
.string.placed{stroke-opacity:.75; stroke-width:1.4}
.string.ideal{stroke:#000000; stroke-width:1.8; stroke-dasharray:7 5; stroke-linecap:butt}
.string.intro{stroke-width:1.6}
.pivot{fill:#FFFFFF; stroke:#000000; stroke-width:1.5; vector-effect:non-scaling-stroke}
.dot{fill:#FFFFFF; stroke:#000000; stroke-width:1.5; vector-effect:non-scaling-stroke}
.ring{fill:none; stroke:#000000; stroke-width:1.6; stroke-dasharray:4 3; vector-effect:non-scaling-stroke}
.ringhalo{fill:none; stroke:rgba(255,255,255,.85); stroke-width:4; vector-effect:non-scaling-stroke}
.mark{fill:none; stroke:#FFFFFF; stroke-width:2; vector-effect:non-scaling-stroke}
.handle{fill:#FFFFFF; stroke:#000000; stroke-width:1.5; vector-effect:non-scaling-stroke}
.brow{fill:none; stroke:#FFFFFF; stroke-width:1.8; stroke-linejoin:round; vector-effect:non-scaling-stroke; animation:fadeIn .8s ease both}
.browhalo{fill:none; stroke:rgba(0,0,0,.35); stroke-width:4.2; stroke-linejoin:round; vector-effect:non-scaling-stroke; animation:fadeIn .8s ease both}
.draw{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  .brow,.browhalo{animation:none}
  .draw{animation:none; stroke-dashoffset:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">Mariels Brow Academy</div>
  <div class="lang" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="es">ES</button>
  </div>
</header>

<main class="app" id="app">
  <div class="stage">
    <svg id="chart" viewBox="60 30 880 880" tabindex="0" role="group" xmlns="http://www.w3.org/2000/svg">
      <image id="photo" x="0" y="0" width="1000" height="1000" preserveAspectRatio="none"/>
      <g id="browG"></g>
      <g id="linesG"></g>
    </svg>
  </div>
  <section class="panel" id="panel"></section>
</main>

      },

      check: 'Revisar', next: 'Siguiente', tryAgain: 'Intentar de nuevo', seeResult: 'Ver mi mapeo',
      verdict: { spot: '¡Exacto!', close: 'Casi', off: 'Todavía no' },
      onLine: 'Justo sobre la línea.', onPoint: 'Justo en el borde externo de la fosa nasal.',
      offAngle: (n, dir) => `Tu línea está ${n}° demasiado hacia ${dir === 'out' ? 'la sien' : 'la nariz'}.`,
      offMeet: (n, dir) => `Tu línea está ${n}° desviada y llega a la línea central muy ${dir === 'high' ? 'arriba' : 'abajo'}.`,

      offPoint: d => `Tu marca quedó ${d}.`,

      showPoint: 'El círculo punteado muestra el ancla correcta. Todas las líneas girarán desde ahí.',
      resultTitle: { key: 'Tu mapeo', eleven: 'Tus once líneas', cross: 'Tu cruce central' },
      accuracy: 'de precisión',
      rating: {
        pro: 'Mapeo de profesional. Estas líneas funcionarían con una clienta real.',
        almost: 'Casi lo tienes. Revisa tu paso más bajo y repite este rostro.',
        keep: 'Sigue practicando. Ve más despacio en las líneas con menor puntaje.'
      },
      best: n => `Tu mejor resultado en este rostro: ${n}%`,
      viewMine: 'Tu mapeo', viewIdeal: 'Mapeo ideal',
      nextFace: 'Siguiente rostro', again: 'Repetir este rostro', home: 'Todas las secciones', allFaces: 'Todos los rostros',
      nudge: { left: 'Izquierda', right: 'Derecha', up: 'Arriba', down: 'Abajo', ccw: 'Girar a la izquierda', cw: 'Girar a la derecha' }
    }
  };

  const VB_FULL = [60, 30, 880, 880];
  const ROUNDS = 6;
  const BEST_KEY = 'mba-map-best-v3';

  const svg = document.getElementById('chart');
  const photo = document.getElementById('photo');
  const browG = document.getElementById('browG');
  const linesG = document.getElementById('linesG');
  const panel = document.getElementById('panel');
  const app = document.getElementById('app');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let lang = (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en';
  try { const s = localStorage.getItem('mba-map-lang'); if (s === 'en' || s === 'es') lang = s; } catch (e) {}
  const params = new URLSearchParams(location.search);
  const EMBED = params.get('embed') === '1';
  const SECTION = ['key', 'eleven', 'cross'].includes(params.get('section')) ? params.get('section') : null;
  if (params.get('lang') === 'en' || params.get('lang') === 'es') lang = params.get('lang');
  if (EMBED) { document.documentElement.classList.add('embed'); document.documentElement.setAttribute('data-theme', 'light'); }

  const S = { screen: 'home', mode: SECTION || 'key', face: 0, step: 0, vals: [], touched: false, checked: false,
              scores: [], fb: null, view: 'mine', best: null, rounds: [], round: 0, answer: null, correct: 0 };

  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const r1 = n => Math.round(n * 10) / 10;
  const pad = n => String(n).padStart(2, '0');
  const angDiff = (a, b) => ((a - b + 540) % 360) - 180;
  const angleTo = (P, Q) => deg(Math.atan2(Q.y - P.y, Q.x - P.x));
  const endPt = (a, ang, len) => ({ x: a.x + len * Math.cos(rad(ang)), y: a.y + len * Math.sin(rad(ang)) });
  const xAt = (a, ang, y) => a.x + (y - a.y) * Math.cos(rad(ang)) / Math.sin(rad(ang));
  const yAtX = (a, ang, x) => a.y + (x - a.x) * Math.tan(rad(ang));
  function interp(ch, x) {
    let i = 0;
    if (x <= ch[0][0]) i = 0; else if (x >= ch[ch.length - 1][0]) i = ch.length - 2;
    else while (i < ch.length - 2 && x > ch[i + 1][0]) i++;
    const [x1, y1] = ch[i], [x2, y2] = ch[i + 1];
    return y1 + (y2 - y1) * (x - x1) / (x2 - x1);
  }
  const F = () => FACES[S.face];

  // ---------- face geometry ----------
  const G = new Map();
  function geom(f) {
    if (G.has(f)) return G.get(f);
    const mid = f.up.map((p, i) => [(p[0] + f.lo[i][0]) / 2, (p[1] + f.lo[i][1]) / 2]);
    const A = { x: f.a[0], y: f.a[1] };
    const sx = f.pts[0][0], ax = f.pts[1][0], tx = f.pts[2][0];
    const g = {
      A, mid, d: f.d, cx: f.cx,
      Ht: { x: sx, y: interp(f.up, sx) }, Hb: { x: sx, y: interp(f.lo, sx) },
      Ap: { x: ax, y: interp(f.up, ax) }, B: { x: ax, y: interp(f.lo, ax) },
      T: { x: tx, y: f.pts[2][1] }, by: [f.pts[0][1], f.pts[1][1], f.pts[2][1]]
    };
    g.top = yAtX(g.T, angleTo(g.T, g.Ap), g.cx) - 0.12 * f.d;
    G.set(f, g);
    return g;
  }

  function stepsFor(mode, f) {
    const g = geom(f), d = f.d, flip = S.face % 2 ? 1 : -1;
    const up = (id, target, init) => ({ id, kind: 'ray', toCenter: false, pivot: g.A, target, init });
    const tc = (id, pivot, toward, off) => { const t = angleTo(pivot, toward); return { id, kind: 'ray', toCenter: true, pivot, target: t, init: t + off }; };
    if (mode === 'key') return [
      { id: 'anchor', kind: 'point', target: g.A },
      up('start', f.ang[0], -68), up('arch', f.ang[1], -80), up('tail', f.ang[2], -96)
    ];
    if (mode === 'eleven') return [
      { id: 1, kind: 'v', target: g.cx, init: g.cx - 0.3 * d },
      up(2, f.ang[0], -68), up(3, f.ang[1], -82), up(4, f.ang[2], -96),
      { id: 5, kind: 'h', target: g.Ht.y, init: g.Ht.y - 0.38 * d },
      { id: 6, kind: 'h', target: g.Hb.y, init: g.Hb.y + 0.32 * d },
      { id: 7, kind: 'h', target: g.Ap.y, init: g.Ap.y - 0.42 * d },
      tc(8, g.T, g.B, 11 * flip), tc(9, g.T, g.Ap, -12 * flip),
      tc(10, g.Ap, g.Ht, -12 * flip), tc(11, g.B, g.Hb, 12 * flip)
    ];
    return [{ id: 'center', kind: 'v', target: g.cx, init: g.cx - 0.3 * d }];
  }
  let STEPS = [];

  function zoomFor(screen) {
    const f = F(), g = geom(f), d = f.d;
    if (screen === 'home') return VB_FULL;
    if (S.mode === 'key') {
      const side = (screen === 'result' ? 1.3 : 1) * 1.85 * d;
      const cx = (g.T.x + g.A.x) / 2 - 0.02 * d * SIDE, cy = (Math.min(...g.by) + g.A.y) / 2;
      return [cx - side / 2, cy - side / 2, side, side];
    }
    if (S.mode === 'eleven') {
      const x0 = g.cx - 0.45 * d, x1 = g.T.x + 0.5 * d, y0 = g.top - 0.2 * d, y1 = g.A.y + 0.18 * d;
      const side = Math.max(x1 - x0, y1 - y0) * (screen === 'result' ? 1.08 : 1);
      return [(x0 + x1) / 2 - side / 2, (y0 + y1) / 2 - side / 2, side, side];
    }
    if (screen === 'step') {
      const side = 2.2 * d, cy = (g.Ht.y + g.A.y) / 2;
      return [g.cx - side / 2, cy - side / 2, side, side];
    }
    if (screen === 'round') {
      const meetY = g.top + 0.12 * d, half = (g.T.x - g.cx) + 0.18 * d, cy = (meetY + g.T.y) / 2;
      return [g.cx - half, cy - half, 2 * half, 2 * half];
    }
    const half = (g.T.x - g.cx) + 0.3 * d, cy = (g.Ap.y + g.Hb.y) / 2 + 0.05 * d;
    return [g.cx - half, cy - half, 2 * half, 2 * half];
  }

  function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; } catch (e) { return {}; } }

  // ---------- drawing ----------
  const P = (x, y) => `${r1(x)},${r1(y)}`;
  function seg(a, b, cls, extra = '') {
    const d = `M${P(a.x, a.y)} L${P(b.x, b.y)}`;
    const halo = cls.includes('ideal') ? 'halo light' : 'halo';
    return `<path class="${halo}${cls.includes('draw') ? ' draw' : ''}" d="${d}"${extra}/><path class="string ${cls}" d="${d}"${extra}/>`;
  }
  const dotAt = (x, y, r) => `<circle class="dot" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  const ringAt = (x, y, r) => `<circle class="ringhalo" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/><circle class="ring" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`;
  const pivotAt = (p, d) => `<circle class="pivot" cx="${r1(p.x)}" cy="${r1(p.y)}" r="${r1(d * 0.026)}"/>`;
  const label = (n, x, y, d, dim) => `<g class="lbl${dim ? ' dim' : ''}"><circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(d * 0.05)}"/><text x="${r1(x)}" y="${r1(y)}" font-size="${r1(d * 0.055)}">${n}</text></g>`;

  // geometry of a placed value for a step: returns {a, b, lab}
  function lineGeo(step, val) {
    const f = F(), g = geom(f), d = f.d;
    if (step.kind === 'v') return { a: { x: val, y: g.top }, b: { x: val, y: g.A.y + 0.2 * d }, lab: { x: val, y: g.top - 0.02 * d } };
    if (step.kind === 'h') {
      const x0 = g.cx - (g.T.x - g.cx) - 0.15 * d, x1 = g.T.x + 0.2 * d;
      return { a: { x: x0, y: val }, b: { x: x1, y: val }, lab: { x: x1 + (step.id === 7 ? 0.18 : 0.07) * d, y: val } };
    }
    const pv = step.pivot;
    if (!step.toCenter) {
      const len = S.mode === 'eleven' ? Math.min(2.6 * d, (pv.y - g.top) / Math.max(0.2, -Math.sin(rad(val)))) : 2.4 * d;
      const e = endPt(pv, val, len);
      return { a: pv, b: e, lab: endPt(pv, val, len + 0.06 * d) };
    }
    const c = Math.cos(rad(val));
    const len = c * SIDE < -0.25 ? (pv.x - g.cx) / (-c * SIDE) * SIDE * SIDE + 0.03 * d : 1.2 * d;
    const e = endPt(pv, val, len);
    return { a: pv, b: e, lab: { x: e.x - 0.08 * d * SIDE, y: e.y } };
  }

  function outlinePath(xs) {
    const f = F(), g = geom(f), d = f.d;
    const [s, a, t] = xs;
    const th = Math.max(interp(f.lo, s) - interp(f.up, s), 0.13 * d);
    const hc = interp(g.mid, s), hT = hc - th / 2, hB = hc + th / 2;
    const aT = Math.min(interp(f.up, a), hT - 0.04 * d), aB = aT + th * 0.85;
    const tY = Math.min(interp(g.mid, t), hB - th * 0.15);
    const L1 = a - s, L2 = t - a;
    return `M${P(s, hB)} ` +
      `C${P(s + L1 * .4, hB - (hB - aB) * .6)} ${P(a - L1 * .25, aB)} ${P(a, aB)} ` +
      `C${P(a + L2 * .35, aB)} ${P(t - L2 * .45, tY + th * .05)} ${P(t, tY)} ` +
      `C${P(t - L2 * .4, tY - th * .25)} ${P(a + L2 * .35, aT)} ${P(a, aT)} ` +
      `C${P(a - L1 * .35, aT)} ${P(s + L1 * .3, hT)} ${P(s + L1 * .06, hT)} ` +
      `C${P(s - L1 * .04, hT + th * .2)} ${P(s - L1 * .04, hB - th * .15)} ${P(s, hB)} Z`;
  }
  function browXs(angles) {
    const g = geom(F());
    return [0, 1, 2].map(i => clamp(xAt(g.A, angles[i], g.by[i]), 30, 970));
  }
  const outline = xs => { const d = outlinePath(xs); return `<path class="browhalo" d="${d}"/><path class="brow" d="${d}"/>`; };

  function drawStepLine(step, val, cls, i, dim) {
    const f = F(), d = f.d, L = lineGeo(step, val);
    let s = seg(L.a, L.b, cls);
    if (S.mode === 'eleven') s += label(step.id, L.lab.x, L.lab.y, d, dim);
    return s;
  }

  function drawOverlay() {
    const f = F(), g = geom(f), d = f.d;
    let b = '', l = '';
    if (S.screen === 'home') {
      // preview: the ideal key-point map
      const angs = f.ang;
      angs.forEach((a, n) => {
        l += seg(g.A, endPt(g.A, a, 2.4 * d), 'intro draw', ` pathLength="1" style="animation-delay:${(.2 + n * .3).toFixed(2)}s"`);
      });
      b = outline(browXs(angs));
      l += pivotAt(g.A, d);
    } else if (S.screen === 'step') {
      const step = STEPS[S.step];
      for (let k = 0; k < S.step; k++) {
        const st = STEPS[k];
        if (st.kind === 'point') continue;
        l += drawStepLine(st, S.vals[k], 'placed', k, true);
      }
      if (step.kind === 'point') {
        if (S.checked) l += ringAt(g.A.x, g.A.y, r1(d * 0.05));
        const p = S.vals[S.step];
        if (p) l += `<circle class="halo" cx="${r1(p.x)}" cy="${r1(p.y)}" r="${r1(d * 0.055)}"/><circle class="mark" cx="${r1(p.x)}" cy="${r1(p.y)}" r="${r1(d * 0.055)}"/>` + dotAt(p.x, p.y, r1(d * 0.016));
      } else {
        if (S.checked) l += drawStepLine(step, step.target, 'ideal', S.step, true);
        l += drawStepLine(step, S.vals[S.step], '', S.step, false);
        if (step.kind === 'ray') {
          if (S.mode === 'key') { const k = S.step - 1; l += dotAt(xAt(g.A, S.vals[S.step], g.by[k]), g.by[k], r1(d * 0.022)); }
          l += pivotAt(step.pivot, d);
        }
      }
      if (S.mode !== 'cross' && S.step > 0 && STEPS[S.step].kind !== 'ray') l += pivotAt(g.A, d);
    } else if (S.screen === 'round') {
      const R = S.rounds[S.round];
      l += seg({ x: g.cx, y: R.yTop }, { x: g.cx, y: R.yBot }, 'placed');
      R.lines.forEach(([a, e]) => { l += seg(a, e, ''); });
      if (S.answer) l += ringAt(R.meet.x, R.meet.y, r1(d * 0.045));
    } else {
      const mine = S.view === 'mine';
      if (S.mode === 'cross') {
        l += drawStepLine(STEPS[0], STEPS[0].target, 'ideal', 0, true) + drawStepLine(STEPS[0], S.vals[0], '', 0, false);
      } else {
        const vals = STEPS.map((st, k) => mine ? S.vals[k] : st.target);
        const rays = S.mode === 'key' ? [1, 2, 3] : [1, 2, 3];
        b = outline(browXs(rays.map(k => vals[k])));
        STEPS.forEach((st, k) => { if (st.kind !== 'point') l += drawStepLine(st, vals[k], mine ? 'placed' : 'ideal', k, false); });
        if (S.mode === 'key') rays.forEach((k, i) => { l += dotAt(xAt(g.A, vals[k], g.by[i]), g.by[i], r1(d * 0.022)); });
        l += pivotAt(g.A, d);
      }
    }
    browG.innerHTML = b;
    linesG.innerHTML = l;
  }

  // ---------- viewBox zoom ----------
  let vb = VB_FULL.slice(), raf = 0;
  const applyVB = () => svg.setAttribute('viewBox', vb.map(n => n.toFixed(2)).join(' '));
  function setView(target) {
    cancelAnimationFrame(raf);
    if (reduce) { vb = target.slice(); applyVB(); return; }
    const from = vb.slice(), t0 = performance.now(), dur = 700;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      vb = from.map((v, i) => v + (target[i] - v) * e);
      applyVB();
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  const showPhoto = () => photo.setAttribute('href', F().img);

  // ---------- cross rounds ----------
  function makeRounds() {
    const f = F(), g = geom(f), d = f.d;
    const types = ['clean', 'off', 'lop', 'off', 'lop', 'clean'].sort(() => Math.random() - .5);
    const mirror = p => ({ x: 2 * g.cx - p.x, y: p.y });
    const intersect = (p1, p2, p3, p4) => {
      const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
      const den = d1x * d2y - d1y * d2x, t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den;
      return { x: p1.x + t * d1x, y: p1.y + t * d1y };
    };
    return types.map(type => {
      let R1 = g.T, R2 = g.Ap, L1 = mirror(g.T), L2 = mirror(g.Ap);
      const sgn = Math.random() < .5 ? -1 : 1, right = Math.random() < .5;
      if (type === 'off') {
        const dx = sgn * (0.26 + Math.random() * 0.08) * d;
        if (right) { R1 = { x: R1.x + dx, y: R1.y }; R2 = { x: R2.x + dx, y: R2.y }; }
        else { L1 = { x: L1.x - dx, y: L1.y }; L2 = { x: L2.x - dx, y: L2.y }; }
      }
      if (type === 'lop') {
        const M = intersect(R1, R2, L1, L2), rot = sgn * (8 + Math.random() * 3);
        const spin = (p) => { const a = angleTo(M, p) + rot, r = Math.hypot(p.x - M.x, p.y - M.y); return endPt(M, a, r); };
        if (right) { R1 = spin(R1); R2 = spin(R2); } else { L1 = spin(L1); L2 = spin(L2); }
      }
      const meet = intersect(R1, R2, L1, L2);
      const ext = (p) => { const a = angleTo(p, meet); return [p, endPt(meet, a, 0.38 * d)]; };
      return { type, meet, lines: [ext(R1), ext(L1)], yTop: meet.y - 0.4 * d, yBot: g.Hb.y + 0.3 * d };
    });
  }

  // ---------- panel ----------
  const icon = {
    left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
    up: '<svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>',
    down: '<svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>',
    ccw: '<svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M4 4v4h4"/></svg>',
    cw: '<svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M20 4v4h-4"/></svg>'
  };
  const nbtn = (dir, lab) => `<button type="button" data-nudge="${dir}" aria-label="${lab}">${icon[dir]}</button>`;

  function stepTexts() {
    const t = T[lang], step = STEPS[S.step];
    if (S.mode === 'key') return { meta: t.stepOf(S.step + 1, 4), title: t.key.titles[S.step], instr: t.key.instr[S.step] };
    if (S.mode === 'eleven') return { meta: t.lineOf(S.step + 1), title: `${step.id}. ${t.eleven.names[S.step]}`, instr: t.eleven.instr[S.step] };
    return { meta: t.stepOf(1, 2), title: t.cross.centerTitle, instr: t.cross.centerInstr };
  }

  function feedbackHTML() {
    const t = T[lang], fb = S.fb;
    let msg;
    if (fb.v === 'spot') msg = fb.kind === 'point' ? t.onPoint : t.onLine;
    else if (fb.kind === 'point') msg = t.offPoint(t.dirs[fb.dir]);
    else if (fb.kind === 'v') msg = t.offV(fb.dir);
    else if (fb.kind === 'h') msg = t.offH(fb.dir);
    else if (fb.toCenter) msg = t.offMeet(fb.n, fb.dir);
    else msg = t.offAngle(fb.n, fb.dir);
    msg += ' ' + (fb.kind === 'point' ? t.showPoint : t.showLine);
    return `<div class="feedback" role="status"><strong>${t.verdict[fb.v]}</strong><p>${msg}</p></div>`;
  }

  function renderPanel() {
    const t = T[lang];
    if (S.screen === 'home') {
      const best = loadBest();
      const secs = ['key', 'eleven', 'cross'].map(m => `<button type="button" data-act="mode" data-v="${m}" aria-pressed="${S.mode === m}"><b>${t.sections[m][0]}</b><small>${t.sections[m][1]}</small></button>`).join('');
      const picks = FACES.map((_, i) => { const bs = best[`${S.mode}-${i}`]; return `<button type="button" data-act="pick" data-v="${i}" aria-pressed="${i === S.face}" aria-label="${t.faceLabel(pad(i + 1))}"><b>${pad(i + 1)}</b><small>${typeof bs === 'number' ? bs + '%' : ''}</small></button>`; }).join('');
      panel.innerHTML = SECTION ? `
        <h1>${t.sections[SECTION][0]}</h1>
        <p class="instr">${t.sections[SECTION][1]} ${t.introBody}</p>` : `
        <h1>${t.introTitle}</h1>
        <p class="instr">${t.introBody}</p>
        <h2>${t.chooseSection}</h2>
        <div class="sections">${secs}</div>`;
      panel.innerHTML += `
        <h2>${t.chooseFace}</h2>
        <div class="facepick">${picks}</div>
        <div class="actions"><button type="button" class="btn" data-act="start">${t.startBtn}</button></div>`;
      return;
    }
    const faceName = `<span>${t.faceLabel(pad(S.face + 1))}</span>`;
    if (S.screen === 'step') {
      const step = STEPS[S.step], tx = stepTexts(), n = STEPS.length;
      const bars = S.mode === 'cross' ? '' : `<div class="progress" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">${STEPS.map((_, k) => `<span class="${k < S.step ? 'done' : k === S.step ? 'now' : ''}"></span>`).join('')}</div>`;
      const nudges = step.kind === 'point' ? nbtn('left', t.nudge.left) + nbtn('up', t.nudge.up) + nbtn('down', t.nudge.down) + nbtn('right', t.nudge.right)
        : step.kind === 'v' ? nbtn('left', t.nudge.left) + nbtn('right', t.nudge.right)
        : step.kind === 'h' ? nbtn('up', t.nudge.up) + nbtn('down', t.nudge.down)
        : nbtn('ccw', t.nudge.ccw) + nbtn('cw', t.nudge.cw);
      const hint = step.kind === 'point' ? t.hintPoint : step.kind === 'ray' ? t.hintRay : t.hintSlide;
      const last = S.step === n - 1;
      const actions = S.checked
        ? `<button type="button" class="btn" data-act="next">${last && S.mode !== 'cross' ? t.seeResult : t.next}</button>
           <button type="button" class="btn ghost" data-act="retry">${t.tryAgain}</button>`
        : `<button type="button" class="btn" id="checkBtn" data-act="check" ${S.touched ? '' : 'disabled'}>${t.check}</button>`;
      panel.innerHTML = `
        <p class="meta">${faceName}<span>${tx.meta}</span></p>
        <h1>${tx.title}</h1>
        ${bars}
        <p class="instr">${tx.instr}</p>
        ${S.checked ? feedbackHTML() : `<p class="hint">${hint}</p><div class="nudges">${nudges}</div>`}
        <div class="actions">${actions}</div>`;
      return;
    }
    if (S.screen === 'round') {
      const R = S.rounds[S.round], c = t.cross;
      const opts = ['clean', 'off', 'lop'].map(k => `<button type="button" class="btn ghost${S.answer === k ? ' picked' : ''}${S.answer && k === R.type ? ' correct' : ''}" data-act="answer" data-v="${k}" ${S.answer ? 'disabled' : ''}>${c.options[k]}</button>`).join('');
      let fb = '';
      if (S.answer) {
        const ok = S.answer === R.type;
        fb = `<div class="feedback" role="status"><strong>${ok ? c.right : T[lang].verdict.off}</strong><p>${ok ? '' : c.wrong[R.type] + ' '}${c.explain[R.type]}</p></div>`;
      }
      panel.innerHTML = `
        <p class="meta">${faceName}<span>${t.roundOf(S.round + 1, ROUNDS)}</span></p>
        <h1>${c.readTitle}</h1>
        <div class="progress" style="grid-template-columns:repeat(${ROUNDS},1fr)" aria-hidden="true">${S.rounds.map((_, k) => `<span class="${k < S.round ? 'done' : k === S.round ? 'now' : ''}"></span>`).join('')}</div>
        <p class="instr">${c.readInstr}</p>
        <div class="choices">${opts}</div>
        ${fb}
        ${S.answer ? `<div class="actions"><button type="button" class="btn" data-act="nextRound">${S.round < ROUNDS - 1 ? t.next : t.seeResult}</button></div>` : ''}`;
      return;
    }
    // results
    const total = resultTotal();
    const rating = total >= 90 ? t.rating.pro : total >= 70 ? t.rating.almost : t.rating.keep;
    const last = S.face === FACES.length - 1;
    let rows;
    if (S.mode === 'cross') rows = `<li><span>${t.cross.names[0]}</span><b>${S.scores[0]}%</b></li><li><span>${t.cross.names[1]}</span><b>${t.cross.tally(S.correct, ROUNDS)}</b></li>`;
    else {
      const names = S.mode === 'key' ? t.key.names : t.eleven.names;
      rows = names.map((nm, i) => `<li><span>${S.mode === 'eleven' ? (i + 1) + '. ' : ''}${nm}</span><b>${S.scores[i]}%</b></li>`).join('');
    }
    const toggle = S.mode === 'cross' ? '' : `<div class="toggle" role="group">
        <button type="button" data-act="view" data-v="mine" aria-pressed="${S.view === 'mine'}">${t.viewMine}</button>
        <button type="button" data-act="view" data-v="ideal" aria-pressed="${S.view === 'ideal'}">${t.viewIdeal}</button>
      </div>`;
    panel.innerHTML = `
      <p class="meta">${faceName}<span>${t.sections[S.mode][0]}</span></p>
      <h1>${t.resultTitle[S.mode]}</h1>
      <div class="score"><b>${total}%</b><span>${t.accuracy}</span></div>
      <p class="instr">${rating}</p>
      ${S.best !== null && S.best > total ? `<p class="hint">${t.best(S.best)}</p>` : ''}
      ${toggle}
      <ul class="breakdown">${rows}</ul>
      <div class="actions">
        ${last ? '' : `<button type="button" class="btn" data-act="nextFace">${t.nextFace}</button>`}
        <button type="button" class="btn ghost" data-act="again">${t.again}</button>
        <button type="button" class="btn ghost" data-act="home">${SECTION ? t.allFaces : t.home}</button>
      </div>`;
  }

  function resultTotal() {
    if (S.mode === 'cross') return Math.round((S.scores[0] + S.correct / ROUNDS * 100) / 2);
    return Math.round(S.scores.reduce((a, b) => a + b, 0) / S.scores.length);
  }

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    svg.setAttribute('aria-label', T[lang].chart);
    app.classList.toggle('interactive', S.screen === 'step' && !S.checked);
    renderPanel();
    drawOverlay();
  }
  const updateCheck = () => { const b = document.getElementById('checkBtn'); if (b) b.disabled = !S.touched; };

  // ---------- flow ----------
  function startStep(i) {
    S.step = i; S.checked = false; S.fb = null;
    const st = STEPS[i];
    S.vals[i] = st.kind === 'point' ? null : st.init;
    S.touched = false;
  }
  function enterMapping() {
    showPhoto();
    STEPS = stepsFor(S.mode, F());
    Object.assign(S, { screen: 'step', vals: [], scores: STEPS.map(() => 0), view: 'mine', best: null, rounds: [], round: 0, answer: null, correct: 0 });
    startStep(0);
    setView(zoomFor('step'));
    render();
  }
  function toHome() { S.screen = 'home'; S.checked = false; showPhoto(); setView(VB_FULL); render(); }
  function toResult() { S.screen = 'result'; S.view = 'mine'; saveBest(); setView(zoomFor('result')); render(); }

  function check() {
    if (!S.touched) return;
    const f = F(), d = f.d, u = d / 110, st = STEPS[S.step], v = S.vals[S.step];
    let fb;
    if (st.kind === 'point') {
      const dx = v.x - st.target.x, dy = v.y - st.target.y, e = Math.hypot(dx, dy) / u;
      S.scores[S.step] = Math.round(clamp(100 - Math.max(0, e - 3) * 3.2, 0, 100));
      const verdict = e <= 7 ? 'spot' : e <= 16 ? 'close' : 'off';
      const dir = Math.abs(dy) > Math.abs(dx) ? (dy < 0 ? 'up' : 'down') : ((dx * SIDE) > 0 ? 'out' : 'in');
      fb = { kind: 'point', v: verdict, dir };
    } else if (st.kind === 'v' || st.kind === 'h') {
      const diff = v - st.target, e = Math.abs(diff) / u;
      S.scores[S.step] = Math.round(clamp(100 - Math.max(0, e - 1.5) * 6, 0, 100));
      const verdict = e <= 3.5 ? 'spot' : e <= 8 ? 'close' : 'off';
      fb = { kind: st.kind, v: verdict, dir: st.kind === 'v' ? (diff > 0 ? 'right' : 'left') : (diff < 0 ? 'high' : 'low') };
    } else {
      const diff = angDiff(v, st.target), a = Math.abs(diff);
      S.scores[S.step] = Math.round(clamp(100 - Math.max(0, a - 1) * 7, 0, 100));
      const verdict = a <= 3 ? 'spot' : a <= 7 ? 'close' : 'off';
      let dir;
      if (st.toCenter) {
        const g = geom(f);
        dir = yAtX(st.pivot, v, g.cx) < yAtX(st.pivot, st.target, g.cx) ? 'high' : 'low';
      } else dir = diff * SIDE > 0 ? 'out' : 'in';
      fb = { kind: 'ray', toCenter: st.toCenter, v: verdict, n: Math.max(1, Math.round(a)), dir };
    }
    S.fb = fb; S.checked = true;
    render();
  }

  function saveBest() {
    const total = resultTotal(), key = `${S.mode}-${S.face}`, store = loadBest();
    S.best = typeof store[key] === 'number' ? store[key] : null;
    if (S.best === null || total > S.best) {
      store[key] = total;
      try { localStorage.setItem(BEST_KEY, JSON.stringify(store)); } catch (e) {}
    }
  }

  function act(a, v) {
    if (a === 'mode') { S.mode = v; render(); return; }
    if (a === 'pick') { S.face = Number(v); showPhoto(); render(); return; }
    if (a === 'start') return enterMapping();
    if (a === 'check') return check();
    if (a === 'retry') { startStep(S.step); render(); return; }
    if (a === 'next') {
      if (S.step < STEPS.length - 1) { startStep(S.step + 1); render(); return; }
      if (S.mode === 'cross') {
        S.rounds = makeRounds(); S.round = 0; S.answer = null; S.correct = 0; S.screen = 'round';
        setView(zoomFor('round')); render(); return;
      }
      return toResult();
    }
    if (a === 'answer') {
      S.answer = v; if (v === S.rounds[S.round].type) S.correct++;
      render(); return;
    }
    if (a === 'nextRound') {
      if (S.round < ROUNDS - 1) { S.round++; S.answer = null; render(); return; }
      return toResult();
    }
    if (a === 'nextFace') { S.face = Math.min(FACES.length - 1, S.face + 1); return enterMapping(); }
    if (a === 'again') return enterMapping();
    if (a === 'home') return toHome();
    if (a === 'view') { S.view = v; render(); }
  }

  // ---------- input ----------
  const toSvg = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  function applyPointer(e) {
    const p = toSvg(e), f = F(), d = f.d, st = STEPS[S.step];
    if (st.kind === 'point') S.vals[S.step] = { x: clamp(p.x, 0, 1000), y: clamp(p.y, 0, 1000) };
    else if (st.kind === 'v') S.vals[S.step] = clamp(p.x, 0, 1000);
    else if (st.kind === 'h') S.vals[S.step] = clamp(p.y, 0, 1000);
    else {
      const dx = p.x - st.pivot.x, dy = p.y - st.pivot.y;
      if (Math.hypot(dx, dy) < 0.1 * d) return;
      if (st.toCenter) { if (dx * SIDE > -0.05 * d) return; }
      else if (dy > -0.07 * d) return;
      S.vals[S.step] = deg(Math.atan2(dy, dx));
    }
    S.touched = true;
    drawOverlay(); updateCheck();
  }
  let dragging = false;
  svg.addEventListener('pointerdown', e => {
    if (S.screen !== 'step' || S.checked) return;
    e.preventDefault();
    dragging = true;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    applyPointer(e);
  });
  svg.addEventListener('pointermove', e => { if (dragging) applyPointer(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => svg.addEventListener(ev, () => { dragging = false; }));

  function nudge(dir) {
    if (S.screen !== 'step' || S.checked) return;
    const f = F(), st = STEPS[S.step], s = f.d * 0.009;
    if (st.kind === 'point') {
      if (!S.vals[S.step]) S.vals[S.step] = { x: f.a[0] - 0.35 * f.d * SIDE, y: f.a[1] - 0.25 * f.d };
      const m = { up: [0, -s], down: [0, s], left: [-s, 0], right: [s, 0] }[dir];
      if (!m) return;
      S.vals[S.step] = { x: S.vals[S.step].x + m[0], y: S.vals[S.step].y + m[1] };
    } else if (st.kind === 'v') {
      if (dir !== 'left' && dir !== 'right') return;
      S.vals[S.step] += dir === 'left' ? -s : s;
    } else if (st.kind === 'h') {
      if (dir !== 'up' && dir !== 'down') return;
      S.vals[S.step] += dir === 'up' ? -s : s;
    } else {
      const k = { ccw: -0.5, cw: 0.5, left: -0.5, right: 0.5 }[dir];
      if (!k) return;
      S.vals[S.step] += k;
    }
    S.touched = true;
    drawOverlay(); updateCheck();
  }

  let holdT = 0, holdI = 0;
  const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); };
  panel.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-nudge]');
    if (!b) return;
    e.preventDefault();
    stopHold();
    nudge(b.dataset.nudge);
    holdT = setTimeout(() => { holdI = setInterval(() => nudge(b.dataset.nudge), 55); }, 350);
  });
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, stopHold));
  panel.addEventListener('pointerleave', stopHold);
  panel.addEventListener('click', e => {
    const n = e.target.closest('[data-nudge]');
    if (n) { if (e.detail === 0) nudge(n.dataset.nudge); return; }
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled) act(b.dataset.act, b.dataset.v);
  });

  svg.addEventListener('keydown', e => {
    if (S.screen !== 'step') return;
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key] && !S.checked) {
      e.preventDefault();
      for (let i = 0; i < (e.shiftKey ? 4 : 1); i++) nudge(map[e.key]);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      act(S.checked ? 'next' : 'check');
    }
  });

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('mba-map-lang', lang); } catch (e) {}
    render();
  }));

  if (EMBED && window.parent !== window) {
    const post = () => window.parent.postMessage({ type: 'mba-practice-height', height: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
    if ('ResizeObserver' in window) new ResizeObserver(post).observe(document.body);
    window.addEventListener('load', post);
    setTimeout(post, 50);
  }

  showPhoto();
  applyVB();
  render();
})();
</script>
</body>
</html>
