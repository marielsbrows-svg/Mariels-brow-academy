<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Free Mini Class Practice | Mariels Brow Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#000000; --card:#FFFFFF; --ink:#000000; --paper:#FFFFFF;
  --soft:#1C1C1C; --mute:#9A9A9A; --line:#D4D4D4; --dim:rgba(255,255,255,.3); --rule:rgba(255,255,255,.1);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#000000; --card:#FFFFFF; --ink:#000000; --paper:#FFFFFF; } }
:root[data-theme="dark"]{ --page:#000000; --card:#FFFFFF; --ink:#000000; --paper:#FFFFFF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 140px)}
html,body{margin:0}
body{background:#fff; color:#000; font-family:Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight:300; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid #fff; outline-offset:2px}
.card :focus-visible{outline-color:#000}
.disp{font-family:Anton, Impact, "Arial Narrow", sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.02em; line-height:.98}
.lbl{display:flex; align-items:center; gap:12px; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin:0 0 14px}
.lbl::before{content:""; width:16px; height:1px; background:rgba(255,255,255,.2)}
.card .lbl{color:#737373}
.card .lbl::before{background:#a3a3a3}

/* nav */
.nav{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:#000; border-bottom:1px solid var(--rule)}
.nav-in{display:flex; align-items:center; justify-content:space-between; height:64px; padding:0 clamp(16px,3vw,32px)}
.logo{display:flex; flex-direction:column; line-height:1}
.logo b{font-family:"Bebas Neue", sans-serif; font-weight:400; font-size:1.5rem; letter-spacing:.15em}
.logo small{font-size:.42rem; font-weight:200; letter-spacing:.45em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-top:3px}
.links{display:flex; gap:22px; font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.55)}
@media (max-width:820px){ .links{display:none} .logo b{font-size:1.1rem} }
.pv{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; color:#000; padding:8px clamp(16px,3vw,32px); font-size:.72rem}
.pv span{letter-spacing:.04em}
.pv button{background:none; border:1px solid #000; padding:6px 12px; font-size:.62rem; letter-spacing:.15em; text-transform:uppercase; cursor:pointer; min-height:34px}

/* layout */
.shell{display:flex}
aside{display:none}
@media (min-width:1024px){
  aside{display:block; width:320px; flex-shrink:0; border-right:1px solid var(--rule); position:sticky; top:calc(env(safe-area-inset-top, 0px) + 112px); align-self:flex-start; max-height:calc(100% - 112px)}
}
.side-hd{padding:24px; border-bottom:1px solid var(--rule)}
.side-hd .disp{font-size:1.35rem; margin:0}
.bar{height:3px; background:rgba(255,255,255,.1); margin-top:16px}
.bar i{display:block; height:100%; background:#fff; transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pct{margin-top:8px; font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--dim)}
.list{padding:16px}
.mod{display:flex; align-items:center; gap:8px; margin:0 8px 12px; font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim)}
.mod::before{content:""; width:12px; height:1px; background:rgba(255,255,255,.2)}
.row{width:100%; display:flex; gap:12px; align-items:flex-start; text-align:left; padding:12px 16px; background:none; border:0; border-left:2px solid transparent; cursor:pointer}
.row:hover{background:rgba(255,255,255,.05)}
.row[aria-current="true"]{background:rgba(255,255,255,.1); border-left-color:#fff}
.tick{width:16px; height:16px; border:1px solid rgba(255,255,255,.25); border-radius:50%; flex-shrink:0; margin-top:2px; display:grid; place-items:center}
.tick.on{background:rgba(255,255,255,.75); border-color:transparent}
.tick.on::after{content:""; width:7px; height:4px; border:solid #000; border-width:0 0 1.5px 1.5px; transform:rotate(-45deg) translate(1px,-1px)}
.row .t{font-size:.8rem; color:rgba(255,255,255,.78)}
.row .m{font-size:.62rem; color:var(--dim); margin-top:2px}

.main{flex:1; min-width:0}
.mtop{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 112px); z-index:20; background:#000; border-bottom:1px solid var(--rule)}
@media (min-width:1024px){ .mtop{display:none} }
.mtop-in{display:flex; align-items:center; gap:12px; padding:12px 16px; font-size:.85rem}
.mtop-in span:first-child{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,.85)}
.mtop-in span:last-child{font-size:.65rem; letter-spacing:.15em; color:rgba(255,255,255,.45)}
.mtop .bar{margin:0}
.content{max-width:896px; margin:0 auto; padding:20px 20px 120px; display:grid; gap:24px}
@media (min-width:1024px){ .content{padding:32px 32px 48px} }

.card{background:var(--card); color:var(--ink); padding:24px}
@media (min-width:1024px){ .card{padding:32px} }
.info h1{font-size:clamp(1.6rem,4vw,2rem); margin:0 0 14px; color:#000}
.info p{margin:0; font-size:.9rem; color:#525252; line-height:1.65; max-width:62ch}

.video{aspect-ratio:16/9; background:#111; border:1px solid var(--rule); display:grid; place-items:center; text-align:center; padding:16px}
.video .play{width:64px; height:64px; border:1px solid rgba(255,255,255,.4); border-radius:50%; display:grid; place-items:center; margin:0 auto 12px}
.video .play::after{content:""; border-style:solid; border-width:10px 0 10px 16px; border-color:transparent transparent transparent #fff; margin-left:4px}
.video p{margin:0; font-size:.72rem; letter-spacing:.06em; color:rgba(255,255,255,.45)}

/* activity */
.act-hd{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 0 6px}
.act-hd .disp{font-size:clamp(1.6rem,4.5vw,2.3rem); margin:0; color:#000}
.step{font-size:.7rem; letter-spacing:.06em; color:#737373; white-space:nowrap}
.dots{display:flex; gap:6px; margin:0 0 18px}
.dots i{height:2px; flex:1; background:#e5e5e5}
.dots i.done{background:#000}
.dots i.now{background:#9a9a9a}
.q{font-size:1.05rem; line-height:1.55; color:#1c1c1c; margin:0 0 18px; max-width:52ch}
.opts{display:grid; gap:8px; margin:0 0 18px}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; padding:14px 16px; min-height:52px; background:#fff; border:1px solid #d4d4d4; cursor:pointer; color:#000; font-size:.92rem; line-height:1.45}
.opt:hover{border-color:#737373}
.opt .k{font-family:"Bebas Neue", sans-serif; font-size:1.15rem; line-height:1.1; color:#9a9a9a; width:14px; flex-shrink:0}
.opt[aria-checked="true"]{border-color:#000; box-shadow:inset 0 0 0 1px #000}
.opt[aria-checked="true"] .k{color:#000}
.opt.right{background:#000; color:#fff; border-color:#000}
.opt.right .k{color:#fff}
.opt.miss{color:#9a9a9a; border-style:dashed}
.opt:disabled{cursor:default}
.fb{border-left:2px solid #000; padding:2px 0 2px 14px; margin:0 0 20px}
.fb strong{display:block; font-family:Anton, Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:1.35rem; letter-spacing:.02em; line-height:1}
.fb p{margin:6px 0 0; font-size:.9rem; color:#404040; max-width:56ch}
.err{font-size:.8rem; color:#b42318; margin:-8px 0 14px}
.btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{min-height:52px; padding:0 22px; background:#000; color:#fff; border:1px solid #000; font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; flex:1 1 auto}
.btn.ghost{background:transparent; color:#000}
.btn:hover{opacity:.85}

.mapwrap{display:grid; gap:20px}
@media (min-width:760px){ .mapwrap{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); align-items:start; gap:32px} }
.stage{aspect-ratio:1/1; background:#f5f5f5; overflow:hidden; width:100%}
.stage svg{display:block; width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.stage svg.live{cursor:crosshair}
.halo{fill:none; stroke:rgba(0,0,0,.38); stroke-width:4.5; stroke-linecap:round; vector-effect:non-scaling-stroke}
.str{fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; vector-effect:non-scaling-stroke}
.str.done{stroke-opacity:.7; stroke-width:1.4}
.ideal{fill:none; stroke:#000; stroke-width:1.8; stroke-dasharray:7 5; vector-effect:non-scaling-stroke}
.ideal-h{fill:none; stroke:rgba(255,255,255,.85); stroke-width:4; vector-effect:non-scaling-stroke}
.anc{fill:#fff; stroke:#000; stroke-width:1.5; vector-effect:non-scaling-stroke}
.flag{fill:none; stroke:#fff; stroke-width:2; stroke-dasharray:4 3; vector-effect:non-scaling-stroke}
.nudge{display:flex; gap:10px; margin:0 0 18px}
.nudge button{width:50px; height:50px; border-radius:50%; border:1px solid #d4d4d4; background:#fff; color:#000; display:grid; place-items:center; cursor:pointer; touch-action:manipulation}
.nudge svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.hint{font-size:.78rem; color:#737373; margin:-6px 0 18px}
.toggle{display:inline-flex; border:1px solid #d4d4d4; margin:0 0 18px}
.toggle button{background:none; border:0; padding:6px 14px; min-height:40px; font-size:.78rem; color:#737373; cursor:pointer}
.toggle button[aria-pressed="true"]{background:#000; color:#fff}
.score{display:flex; align-items:baseline; gap:10px; margin:0 0 4px}
.score b{font-family:"Bebas Neue", sans-serif; font-weight:400; font-size:clamp(72px,12vw,110px); line-height:.85; color:#000}
.score span{color:#737373; font-size:.85rem}
.brk{list-style:none; padding:0; margin:0 0 22px; border-top:1px solid #e5e5e5}
.brk li{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #e5e5e5; font-size:.9rem; color:#1c1c1c}

.done-card .disp{font-size:clamp(1.9rem,5.5vw,2.8rem); margin:0 0 18px; color:#000}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:#e5e5e5; border:1px solid #e5e5e5; margin:0 0 24px}
.stats div{background:#fff; padding:16px}
.stats b{display:block; font-family:"Bebas Neue", sans-serif; font-weight:400; font-size:2.6rem; line-height:1}
.stats span{font-size:.75rem; color:#737373}
.sub{font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:#737373; margin:0 0 10px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 24px}
.chips span{border:1px solid #d4d4d4; padding:6px 12px; font-size:.82rem}
.rev{list-style:none; padding:0; margin:0 0 24px}
.rev li{border-top:1px solid #e5e5e5}
.rev li:last-child{border-bottom:1px solid #e5e5e5}
.rev button{width:100%; display:flex; justify-content:space-between; gap:12px; text-align:left; padding:14px 0; background:none; border:0; cursor:pointer; color:#000; font-size:.9rem}
.rev button small{color:#737373; white-space:nowrap}
.none{font-size:.92rem; color:#404040; margin:0 0 24px}
.cta{background:#000; color:#fff; border:1px solid rgba(255,255,255,.18); padding:32px 24px; text-align:center}
@media (min-width:1024px){ .cta{padding:48px} }
.cta .disp{font-size:clamp(2rem,6vw,3.2rem); margin:0 auto 18px; max-width:16ch}
.cta p{margin:0 auto 26px; max-width:48ch; font-size:.92rem; color:rgba(255,255,255,.7); line-height:1.65}
.cta a{display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 30px; background:#fff; color:#000; text-decoration:none; font-size:.66rem; letter-spacing:.2em; text-transform:uppercase}
.cta small{display:block; margin-top:14px; font-size:.7rem; color:rgba(255,255,255,.4)}
.mark{text-align:center}
.mark .disp{font-size:1.4rem; margin:0 0 18px; color:#000}
.mark .btn{flex:none}
.pn{display:none}
@media (min-width:1024px){ .pn{display:flex; justify-content:space-between; padding-top:16px; border-top:1px solid var(--rule)} }
.pn button{min-height:46px; padding:0 22px; font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:none; color:rgba(255,255,255,.65)}
.pn button.fw{background:#fff; color:#000; border-color:#fff}
.pn button:disabled{opacity:.2; cursor:not-allowed}

.mnav{position:fixed; left:0; right:0; bottom:0; z-index:25; background:#000; border-top:1px solid var(--rule); display:flex; gap:8px; padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px))}
@media (min-width:1024px){ .mnav{display:none} }
.mnav button{height:48px; border-radius:12px; background:rgba(255,255,255,.06); border:0; color:#fff; cursor:pointer; font-size:.78rem; letter-spacing:.04em}
.mnav .sq{width:48px; flex-shrink:0; font-size:1.2rem}
.mnav .fw{background:#fff; color:#000}
.mnav .mid{flex:1}
.mnav button:disabled{opacity:.25}
.scrim{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6)}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:78%; overflow:auto; background:#141414; border-radius:16px 16px 0 0; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.sheet-hd{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--rule); font-size:.9rem}
.sheet-hd button{background:none; border:0; color:rgba(255,255,255,.6); cursor:pointer; min-height:40px; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@keyframes up{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.enter > *{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.06s}.enter > *:nth-child(3){animation-delay:.12s}.enter > *:nth-child(n+4){animation-delay:.18s}
@media (prefers-reduced-motion: reduce){ .enter > *{animation:none} .bar i{transition:none} }

.wrap{padding:0}
.card{padding:clamp(20px,4vw,32px)}
.cta{border:0}
</style>
</head>

<main class="wrap" id="content"></main>

  function checkHTML(key) {
    const C = CHECKS[key], st = S[key];
    if (st.i >= C.qs.length) return null;
    const q = C.qs[st.i], n = C.qs.length;
    const dots = n > 1 ? `<div class="dots">${C.qs.map((_, i) => `<i class="${i < st.i ? "done" : i === st.i ? "now" : ""}"></i>`).join("")}</div>` : "";
    const right = st.checked && st.sel === q.a;
    const opts = q.opts.map((o, i) => {
      let cls = "opt";
      if (st.checked && i === st.sel) cls += i === q.a ? " right" : " miss";
      return `<button type="button" role="radio" class="${cls}" data-pick="${i}" aria-checked="${st.sel === i}" ${right ? "disabled" : ""}><span class="k">${"ABC"[i]}</span><span>${esc(o)}</span></button>`;
    }).join("");
    const fb = st.checked ? `<div class="fb" role="status"><strong>${right ? "Correct" : "Not quite"}</strong><p>${esc(q.fb[st.sel])}</p></div>` : "";
    const btns = !st.checked ? `<button type="button" class="btn" data-a="check">Check answer</button>`
      : right ? `<button type="button" class="btn" data-a="cnext">${st.i + 1 < n ? "Next question" : key === "final" ? "See my results" : "Continue"}</button>`
      : `<button type="button" class="btn" data-a="retry">Try again</button>`;
    return `<section class="card" aria-labelledby="ah"><p class="lbl">${C.label}</p><div class="act-hd"><h2 class="disp" id="ah">Check your eye</h2>${n > 1 ? `<span class="step">Question ${st.i + 1} of ${n}</span>` : ""}</div>${dots}<p class="q">${esc(q.q)}</p><div class="opts" role="radiogroup" aria-label="Answers">${opts}</div><div id="err"></div>${fb}<div class="btns">${btns}</div></section>`;
  }

  function mapHTML() {
    const M = S.map;
    if (M.result) {
      const total = Math.round(M.scores.reduce((a, b) => a + b, 0) / 3);
      const lines = (M.view === "mine" ? M.vals : FACE.ang).map(v => string(v)).join("");
      const rating = total >= 85 ? "Mapped like a pro. These lines would hold up on a real client." : total >= 60 ? "Almost there. Look at your lowest line and map this face again." : "Keep practicing. Slow down on the lines that scored lowest.";
      return `<section class="card"><p class="lbl">Practice</p><div class="mapwrap">${svg(lines, M.view === "mine" ? "Your three mapping lines" : "Mariel’s mapping lines", false)}<div>
        <div class="act-hd"><h2 class="disp">Your brow map</h2></div>
        <div class="score"><b>${total}</b><span>accuracy</span></div><p class="q" style="font-size:.92rem">${rating}</p>
        <div class="toggle" role="group" aria-label="Compare maps"><button type="button" data-a="mview" data-v="mine" aria-pressed="${M.view === "mine"}">Your map</button><button type="button" data-a="mview" data-v="ideal" aria-pressed="${M.view === "ideal"}">Ideal map</button></div>
        <ul class="brk">${MAP_STEPS.map((s, i) => `<li><span>${s.name}</span><b>${M.scores[i]}%</b></li>`).join("")}</ul>
        <div class="btns"><button type="button" class="btn ghost" data-a="mapagain">Map again</button></div>${nextNote}</div></div></section>`;
    }
    const st = MAP_STEPS[M.step];
    let lines = "";
    for (let i = 0; i < M.step; i++) lines += string(M.vals[i], "done");
    if (M.checked) lines += ideal(FACE.ang[M.step]);
    lines += string(M.vals[M.step]);
    let fb = "";
    if (M.checked) {
      const diff = M.vals[M.step] - FACE.ang[M.step], a = Math.abs(diff);
      const v = a <= 3 ? "Spot on" : a <= 7 ? "Close" : "Not quite";
      const msg = a <= 3 ? "Right on the line." : `Your line is ${Math.max(1, Math.round(a))}° too far toward the ${diff > 0 ? "temple" : "nose"}. The dashed line shows the true placement.`;
      fb = `<div class="fb" role="status"><strong>${v}</strong><p>${msg}</p></div>`;
    }
    const dots = `<div class="dots">${MAP_STEPS.map((_, i) => `<i class="${i < M.step ? "done" : i === M.step ? "now" : ""}"></i>`).join("")}</div>`;
    const ico = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
    const nud = M.checked ? "" : `<div class="nudge"><button type="button" data-a="rot" data-v="-1" aria-label="Rotate toward the nose">${ico("M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4")}</button><button type="button" data-a="rot" data-v="1" aria-label="Rotate toward the temple">${ico("M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4")}</button></div><p class="hint">Drag on the face to swing the string, or use these buttons to fine-tune.</p>`;
    const btns = !M.checked ? `<button type="button" class="btn" data-a="mcheck">Check</button>`
      : `<button type="button" class="btn ghost" data-a="mretry">Try again</button><button type="button" class="btn" data-a="mnext">${M.step < 2 ? "Next" : "See my map"}</button>`;
    return `<section class="card" aria-labelledby="ah"><p class="lbl">Practice</p><div class="mapwrap">${svg(lines, "Practice face. The anchor is placed at the outer edge of the nostril. Drag or use the arrow keys to swing the string.", !M.checked)}<div>
      <div class="act-hd"><h2 class="disp" id="ah">${st.title}</h2><span class="step">Step ${M.step + 1} of 3</span></div>${dots}
      ${M.step === 0 && !M.checked ? `<p class="hint" style="margin:0 0 10px">The anchor is already placed at the outer edge of the nostril. Every line pivots from this point.</p>` : ""}
      <p class="q">${st.instr}</p>${nud}${fb}<div class="btns">${btns}</div></div></div></section>`;
  }

  function mistakeHTML() {
    const M = S.mistake;
    const showFix = M.solved && M.view === "fixed";
    const lines = string(FACE.ang[0]) + (showFix ? string(FACE.ang[1]) : string(MISTAKE_ARCH)) + string(FACE.ang[2]);
    const names = ["The start", "The arch", "The tail"];
    const opts = names.map((o, i) => {
      let cls = "opt";
      if (M.checked && i === M.sel) cls += i === 1 ? " right" : " miss";
      return `<button type="button" role="radio" class="${cls}" data-mpick="${i}" aria-checked="${M.sel === i}" ${M.solved ? "disabled" : ""}><span class="k">${"ABC"[i]}</span><span>${o}</span></button>`;
    }).join("");
    let fb = "";
    if (M.checked && M.sel === 1) fb = `<div class="fb" role="status"><strong>Good eye</strong><p>The arch line was swung toward the nose, inside the pupil, so the peak would sit too far in and the brow would look short. On this face, the string through the center of the pupil puts the arch where it balances her eye.</p></div>`;
    else if (M.checked) fb = `<div class="fb" role="status"><strong>Not quite</strong><p>${M.sel === 0 ? "The start line runs straight up from the anchor, right where it belongs." : "The tail line runs past the outer corner of the eye, right where it belongs."} Compare the middle line to the center of the pupil.</p></div>`;
    const tog = M.solved ? `<div class="toggle" role="group" aria-label="Compare"><button type="button" data-a="xview" data-v="mistake" aria-pressed="${M.view === "mistake"}">Before</button><button type="button" data-a="xview" data-v="fixed" aria-pressed="${M.view === "fixed"}">Corrected</button></div>` : "";
    const btns = M.solved ? "" : M.checked ? `<div class="btns"><button type="button" class="btn" data-a="xretry">Try again</button></div>` : `<div class="btns"><button type="button" class="btn" data-a="xcheck">Check answer</button></div>`;
    return `<section class="card" aria-labelledby="ah"><p class="lbl">Challenge</p><div class="mapwrap">${svg(lines, showFix ? "Corrected brow map" : "Brow map with one mistake", false)}<div>
      <div class="act-hd"><h2 class="disp" id="ah">Spot the mistake</h2></div>
      <p class="q">Something in this brow map is off. What would you correct before beginning the service?</p>
      <div class="opts" role="radiogroup" aria-label="Answers">${opts}</div><div id="err"></div>${fb}${tog}${btns}${M.solved ? nextNote : ""}</div></div></section>`;
  }

  function resultsHTML() {
    const total = S.map.scores.length === 3 ? Math.round(S.map.scores.reduce((a, b) => a + b, 0) / 3) : null;
    const review = [];
    if (!S.done.check1) review.push(["Why brows come out uneven", "Quick check not done yet"]);
    else if (S.check1.first[0] === false) review.push(["Why brows come out uneven", "The over-tweezing trap"]);
    if (!S.done.map) review.push(["Watch me map her", "Practice not done yet"]);
    else if (total !== null && total < 85) review.push(["Watch me map her", `${MAP_STEPS[S.map.scores.indexOf(Math.min(...S.map.scores))].name} placement`]);
    if (!S.done.mistake) review.push(["What the map revealed", "Challenge not done yet"]);
    else if (S.mistake.tries > 1) review.push(["What the map revealed", "Reading the arch"]);
    if (S.final.first[0] === false) review.push(["Watch me map her", "Where the arch line goes"]);
    if (S.final.first[1] === false) review.push(["The fill, the reveal, what’s next", "Filling the gap"]);
    const rev = review.length ? `<p class="sub">Worth a replay</p><ul class="rev">${review.map(r => `<li><div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;font-size:.9rem"><span>${esc(r[0])}</span><small style="color:#737373;text-align:right">${esc(r[1])}</small></div></li>`).join("")}</ul>`
      : `<p class="none">Nothing to review. You’re ready for the next step.</p>`;
    return `<section class="card done-card"><p class="lbl">Your results</p><h2 class="disp">You’ve completed the free mini class</h2>
      <div class="stats"><div><b>${actsDone()} / 4</b><span>Activities completed</span></div><div><b>${total === null ? "—" : total + "%"}</b><span>Mapping accuracy</span></div></div>
      <p class="sub">What you practiced</p><div class="chips"><span>Facial analysis</span><span>Start, arch and tail</span><span>Visual balance</span><span>Filling the gap</span></div>
      ${rev}<div class="btns"><button type="button" class="btn ghost" data-a="again">Answer the final check again</button></div></section>
      <section class="cta"><h2 class="disp">You’ve learned the foundation. Now master the technique.</h2>
      <p>Ready to go beyond the three mapping points? Inside Brow Mapping Mastery, you’ll learn the eleven-point system, facial analysis, symmetry corrections and professional brow design.</p>
      <a href="${COURSE_URL}" target="_top">Continue your education — $47</a></section>`;
  }

  function render() {
    let html = "";
    if (ACT === "check1") html = checkHTML("check1") || `<section class="card"><p class="lbl">Quick check</p><div class="fb"><strong>Quick check complete</strong><p>Nice work. When you’re ready, mark this lesson complete below and continue.</p></div><div class="btns"><button type="button" class="btn ghost" data-a="redo">Answer again</button></div></section>`;
    if (ACT === "map") html = mapHTML();
    if (ACT === "mistake") html = mistakeHTML();
    if (ACT === "final") html = S.done.final ? resultsHTML() : checkHTML("final");
    document.getElementById("content").innerHTML = html;
    bindFace();
  }

  function bindFace() {
    const el = document.getElementById("face");
    if (!el || !el.classList.contains("live")) return;
    const setFrom = ev => {
      const pt = el.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(el.getScreenCTM().inverse());
      S.map.vals[S.map.step] = clamp(Math.atan2(p.y - FACE.a[1], p.x - FACE.a[0]) * 180 / Math.PI, -120, -25); paintLive();
    };
    let drag = false;
    el.addEventListener("pointerdown", e => { drag = true; el.setPointerCapture(e.pointerId); setFrom(e); });
    el.addEventListener("pointermove", e => { if (drag) setFrom(e); });
    const up = () => { if (drag) { drag = false; save(); } };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    el.addEventListener("keydown", e => {
      const k = { ArrowLeft: -0.5, ArrowDown: -0.5, ArrowRight: 0.5, ArrowUp: 0.5 }[e.key];
      if (k) { e.preventDefault(); rotate(k * (e.shiftKey ? 4 : 1)); }
    });
  }
  function paintLive() {
    const el = document.getElementById("face"); if (!el) return;
    const ls = el.querySelectorAll("line"), n = ls.length, e = end(S.map.vals[S.map.step]);
    [ls[n - 2], ls[n - 1]].forEach(l => { l.setAttribute("x2", e[0].toFixed(1)); l.setAttribute("y2", e[1].toFixed(1)); });
  }
  function rotate(d) { S.map.vals[S.map.step] = clamp(S.map.vals[S.map.step] + d, -120, -25); paintLive(); save(); }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-a],[data-pick],[data-mpick]"); if (!t) return;
    const key = ACT;
    if (t.dataset.pick !== undefined) { const st = S[key]; if (st.checked && st.sel === CHECKS[key].qs[st.i].a) return; st.sel = +t.dataset.pick; st.checked = false; save(); return render(); }
    if (t.dataset.mpick !== undefined) { if (S.mistake.solved) return; S.mistake.sel = +t.dataset.mpick; S.mistake.checked = false; save(); return render(); }
    const a = t.dataset.a, v = t.dataset.v;
    if (a === "check") {
      const st = S[key];
      if (st.sel === null) { document.getElementById("err").innerHTML = `<p class="err">Choose an answer first.</p>`; return; }
      st.checked = true; const ok = st.sel === CHECKS[key].qs[st.i].a;
      if (st.first[st.i] === undefined) st.first[st.i] = ok;
      save(); render(); say(ok ? "Correct" : "Not quite. Read the explanation and try again.");
    }
    if (a === "retry") { S[key].sel = null; S[key].checked = false; save(); render(); }
    if (a === "cnext") { const st = S[key]; st.i++; st.sel = null; st.checked = false; if (st.i >= CHECKS[key].qs.length) S.done[key] = true; save(); render(); }
    if (a === "redo") { S.check1 = blankCheck(); save(); render(); }
    if (a === "rot") rotate(+v);
    if (a === "mcheck") { S.map.checked = true; S.map.scores[S.map.step] = scoreFor(S.map.vals[S.map.step] - FACE.ang[S.map.step]); save(); render(); say(document.querySelector(".fb")?.textContent || ""); }
    if (a === "mretry") { S.map.checked = false; save(); render(); }
    if (a === "mnext") { S.map.checked = false; if (S.map.step < 2) S.map.step++; else { S.map.result = true; S.done.map = true; } save(); render(); }
    if (a === "mview") { S.map.view = v; save(); render(); }
    if (a === "mapagain") { S.map = blankMap(); save(); render(); }
    if (a === "xcheck") {
      if (S.mistake.sel === null) { document.getElementById("err").innerHTML = `<p class="err">Choose an answer first.</p>`; return; }
      S.mistake.checked = true; S.mistake.tries++; if (S.mistake.sel === 1) { S.mistake.solved = true; S.done.mistake = true; } save(); render();
    }
    if (a === "xretry") { S.mistake.sel = null; S.mistake.checked = false; save(); render(); }
    if (a === "xview") { S.mistake.view = v; save(); render(); }
    if (a === "again") { S.final = blankCheck(); S.done.final = false; save(); render(); }
  });

  if (window.parent !== window) {
    const post = () => window.parent.postMessage({ type: "mba-practice-height", height: Math.ceil(document.body.getBoundingClientRect().height) }, location.origin);
    if ("ResizeObserver" in window) new ResizeObserver(post).observe(document.body);
    window.addEventListener("load", post);
  }
  render();
})();

</script>
</body>
</html>
