<style>:root{--ink:#191a1e;--paper:#f5f4f1;--line:#dedbd6;--line2:#e1dfd8;--muted:#77736e;--soft:#65635c;--card:#fdfcf9;
  --mba-display:'Horizon','Arial Black',Arial,sans-serif;--mba-mono:'Anonymous Pro','Courier New',monospace;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mba-mono);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #aa8563;outline-offset:3px}
h1,h2,h3{font-family:var(--mba-display);font-weight:900;text-transform:uppercase;letter-spacing:0;line-height:1.08;overflow-wrap:break-word;margin:0}
.wrap{width:min(1370px,calc(100% - 36px));margin:0 auto}

/* shell — same as the free class */
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:20px 0;gap:12px}
.brand-logo{display:block;height:46px;width:auto}
.lang{display:inline-flex;border:1px solid var(--line);background:#fff}
.lang button{border:0;background:transparent;padding:8px 11px;font:700 11px var(--mba-mono);letter-spacing:.1em}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.top{padding:36px 0 25px}
.kicker{font:11px/1.45 var(--mba-mono);letter-spacing:.18em;text-transform:uppercase;color:#847f76}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.top h1{font-size:clamp(24px,3.4vw,44px);margin:14px 0}
.top p{max-width:700px;font:13px/1.7 var(--mba-mono);color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:24px 0 18px}
.tab{border:1px solid var(--line);background:#fff;color:#2c2b29;text-align:left;padding:14px 12px;min-height:75px}
.tab[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:#fff}
.tab .num{display:block;font:11px var(--mba-mono);margin-bottom:5px;opacity:.7}
.tab .lbl{font-size:13px;font-weight:800;letter-spacing:-.02em}
.tab .seen{font:10px var(--mba-mono);opacity:.6;padding-left:4px}
.frame{border:1px solid var(--line);background:var(--paper)}
.inner{width:min(1320px,calc(100% - 52px));margin:0 auto;padding:37px 0 40px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0 45px}
.control{padding:13px 20px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;font-size:13px;font-weight:800}
.control.primary{background:var(--ink);color:#fff}.control:disabled{opacity:.25;cursor:default}
.state{font:11px/1.6 var(--mba-mono);color:var(--muted);text-align:center}
.foot{border-top:1px solid var(--line);padding:22px 0 45px;display:flex;justify-content:space-between;gap:15px;font:10px/1.6 var(--mba-mono);letter-spacing:.1em;color:#888}

/* lesson — same as the free class lessons */
.lk{font:12px/1.5 var(--mba-mono);letter-spacing:.25em;color:#8b8982;margin:0 0 12px;text-transform:uppercase}
.lt{font-size:clamp(22px,3vw,38px)}
.subtitle{font:15px/1.65 var(--mba-mono);color:#6f6d68;margin:20px 0 30px;max-width:780px}
.steps{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;margin:0 0 25px}
.step{border:1px solid var(--line2);background:#fbfaf7;border-radius:3px;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.step-num{width:32px;height:32px;border:1px solid #c9c4bc;border-radius:50%;display:grid;place-items:center;flex:0 0 32px;font:12px var(--mba-mono);overflow:hidden}
.step-num img{max-width:26px;max-height:26px;object-fit:contain}
.step-title{display:block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.step-sub{display:block;font:10px/1.5 var(--mba-mono);color:var(--muted);margin-top:3px}
.step.active{background:var(--ink);color:#fff;border-color:var(--ink)}.step.active .step-sub{color:#d0c9c0}.step.active .step-num{border-color:#fff6}
.step.done{border-color:#9fa898;background:#eef1ea}.step.done .step-num{background:#2f3a2e;color:#fff;border-color:#2f3a2e}
.step.miss{border-color:#d7b9a3;background:#f7eee7}
.step:disabled{opacity:.45;cursor:default}
.lesson{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:clamp(20px,3vw,48px);align-items:stretch}
.photo-col{min-width:0;align-self:start}
.photo-shell{position:relative;overflow:hidden;border-radius:4px;background:#fff;aspect-ratio:1/1;box-shadow:0 20px 40px #16161612;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;inset:0;transform-origin:52% 39%;transform:scale(1.6)}
.zoom>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.zoom>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.photo-tag{position:absolute;top:15px;left:15px;background:#faf9f1ed;border-radius:2px;color:#282724;padding:10px 12px;font:10px var(--mba-mono);letter-spacing:.1em;z-index:6;text-transform:uppercase}
.photo-caption{position:absolute;bottom:14px;left:15px;right:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;z-index:6}
.photo-caption span{padding:7px 10px;background:#111b;color:#fff;font:11px var(--mba-mono);letter-spacing:.06em;backdrop-filter:blur(8px);text-transform:uppercase}
.photo-note{font:11px/1.6 var(--mba-mono);color:#8b877f;margin:12px 2px 0}
.hotspot{position:absolute;z-index:5;transform:translate(-50%,-50%) scale(.625);width:40px;height:40px;border:1.5px solid #1616167a;border-radius:50%;background:#f7f5ed;color:#1c1c1c;font:bold 12px var(--mba-mono);box-shadow:0 0 0 5px #ffffff54,0 5px 14px #0003;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.hotspot.is-active{background:#1d1d1d;color:#fff;border-color:#fff;box-shadow:0 0 0 6px #ffffffaa,0 5px 16px #0006}
.panel{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--ink);padding:clamp(24px,3vw,42px);display:flex;flex-direction:column;min-height:565px;border-radius:2px;min-width:0}
.panel-head{display:flex;align-items:start;justify-content:space-between;gap:10px}
.eyebrow{font:12px var(--mba-mono);letter-spacing:.17em;color:var(--muted);text-transform:uppercase}
.counter{font:11px var(--mba-mono);color:#777;text-transform:uppercase;white-space:nowrap}
.panel h2{font-size:clamp(20px,2.2vw,28px);margin:17px 0 10px}
.excerpt{font:16px/1.55 var(--mba-mono);color:#65635c;margin:0 0 24px}
.rule{border:0;border-top:1px solid #e4e2dc;margin:0 0 23px}
.copyblock{margin-bottom:17px}.copyblock strong{display:block;font:700 11px/1.4 var(--mba-mono);letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}
.copyblock p{margin:0;font-size:15px;line-height:1.6;color:#40403c}
.card-bottom{margin-top:auto;padding-top:8px}
.tiny-progress{display:flex;gap:5px;margin:0 0 20px}.tiny-progress span{height:4px;background:#dad8d1;flex:1;border-radius:6px}.tiny-progress span.done{background:#2f2e29}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.action{border:1px solid #1a1a1a;border-radius:3px;padding:13px 16px;font-size:13px;font-weight:700;background:transparent;color:#151515;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.action.primary{background:#151515;color:#fff;flex:1}.action:hover{filter:brightness(1.12)}.action:disabled{opacity:.4;cursor:default}
.helper{font:12px/1.6 var(--mba-mono);color:#73716a;margin-top:13px}
.micro{font:700 11px/1.4 var(--mba-mono);letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;color:#3a3936}
.choices{display:grid;gap:8px;margin-bottom:20px}
.choice{padding:13px 15px;border:1px solid var(--line);text-align:left;background:#fbfaf7;font-size:14px;border-radius:2px}
.choice:hover:not(:disabled){border-color:#7c766d}
.choice.right{background:#e8eee6;border-color:#9fb19a}.choice.wrong{background:#f6ece3;border-color:#dcc0ab}
.choice:disabled{cursor:default}
.feedback{padding:12px 14px;margin:0 0 16px;font:14px/1.55 var(--mba-mono);display:none}
.feedback.correct{background:#e8eee6;display:block}.feedback.wrong{background:#f6ece3;display:block}.feedback.info{background:#f1f0ec;display:block}
.feedback b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.tip{background:#f1f0ec;border:1px solid #e1ded6;padding:15px;margin:0 0 18px}
.tip strong{display:block;font:bold 11px var(--mba-mono);letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}
.tip span{font-size:13px;line-height:1.6;color:#55524c}
.practice{margin-top:24px;padding:25px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#eeede8}
.practice h3{font-size:clamp(16px,1.6vw,20px);margin:0 0 7px}.practice p{font:13px/1.55 var(--mba-mono);color:#69665f;margin:0}
.practice .action{flex:0 0 auto;min-width:200px}
.quiz{display:none;max-width:760px;margin:22px auto 10px;background:#fff;border:1px solid var(--line);padding:24px 28px}
.quiz.is-open{display:block}.quiz>strong{font:12px var(--mba-mono);letter-spacing:.14em}
.quiz h3{font-family:var(--mba-mono);font-weight:700;text-transform:none;line-height:1.35;font-size:18px;margin:14px 0 17px}
.lfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;font:10px/1.5 var(--mba-mono);letter-spacing:.13em;color:#96948c;margin-top:35px;text-transform:uppercase}

/* svg drawing */
.str-shadow{stroke:#2a241f;stroke-width:6;opacity:.45;fill:none;stroke-linecap:round}
.str{stroke:#fffdf7;stroke-width:2.6;fill:none;stroke-linecap:round;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.7))}
.draw{stroke-dasharray:var(--len,700);stroke-dashoffset:var(--len,700);animation:draw 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.2,1.4) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}
.anchor{fill:#f8f5eb;stroke:#171717;stroke-width:1.5}
.target-ring{fill:rgba(249,248,241,.1);stroke:#fff;stroke-width:1.5}.target-dot{fill:#fff}
.outline-map{fill:none;stroke:#fffdf7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.65))}
.outline-free{fill:none;stroke:#f6c7a6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.65))}
.brow-top{stroke-dasharray:0.1 6;stroke-width:2.6}
.miss-x{stroke:#ffe2cf;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8))}
.gap-line{stroke:#ffe2cf;stroke-width:2;stroke-dasharray:4 4;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8))}
.svg-label{font:700 13px var(--mba-mono);letter-spacing:.08em;fill:#fff;paint-order:stroke;stroke:#191a1ecc;stroke-width:4px}

/* tablets and the course page: keep the face and the guide side by side so the string is always in view */
@media(max-width:1000px){
  .lesson{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:16px}
  .inner{width:calc(100% - 28px);padding-top:24px}
  .panel{min-height:0;padding:20px 18px}
  .panel h2{font-size:clamp(16px,2.4vw,20px);margin:12px 0 8px}
  .eyebrow,.counter{font-size:10px;letter-spacing:.12em}
  .excerpt{font-size:13.5px;line-height:1.5;margin-bottom:14px}
  .rule{margin-bottom:14px}
  .copyblock{margin-bottom:11px}.copyblock strong{font-size:10px;margin-bottom:4px}.copyblock p{font-size:12.5px;line-height:1.55}
  .action{padding:11px 12px;font-size:12px}
  .choice{padding:10px 11px;font-size:12.5px}.choices{gap:6px;margin-bottom:14px}
  .tip{padding:11px;margin-bottom:12px}.tip span{font-size:12px}.tip strong{font-size:10px;margin-bottom:5px}
  .feedback{font-size:12.5px;padding:10px 12px;margin-bottom:12px}
  .micro{font-size:10px;margin-bottom:7px}
  .helper{font-size:11px}
  .tiny-progress{margin-bottom:12px}
  .subtitle{font-size:13.5px;margin:12px 0 18px}
  .lt{font-size:clamp(20px,3.2vw,28px)}
  .photo-tag{font-size:8.5px;padding:7px 8px;top:10px;left:10px}
  .photo-caption{bottom:9px;left:10px;right:10px}.photo-caption span{font-size:9px;padding:6px 8px}
}
@media(max-width:560px){
  .lesson{grid-template-columns:1fr;gap:16px}.photo-col{width:100%;margin:auto}
}
@media(max-width:680px){
  .wrap{width:calc(100% - 22px)}.header{padding:14px 0}.brand-logo{height:34px}.top{padding:26px 5px 12px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.tab{min-height:65px;padding:11px 12px}.tab .lbl{font-size:12px}
  .control{padding:12px 13px}.state{font-size:10px}.foot{flex-direction:column}
  .steps{grid-template-columns:repeat(var(--nm,3),minmax(0,1fr));gap:6px}.step{padding:9px;gap:8px}.step-num{width:28px;height:28px;flex-basis:28px}.step-title{font-size:10px;letter-spacing:.04em}.step-sub{font-size:9px}
}
@media(max-width:480px){
  .panel{padding:22px}.practice{padding:20px;display:block}.practice .action{margin-top:18px;width:100%}
  .photo-tag{font-size:8px;top:10px;left:10px;padding:8px 9px}.photo-caption{bottom:9px;left:10px;right:10px}.photo-caption span{font-size:9px}
  .lfoot{display:block}.lfoot span{display:block;margin-bottom:8px}.step-sub{display:none}
}
/* inside the course page */
html.embed .header{display:none}
html.embed .top{padding-top:10px}
html.embed .controls{padding-bottom:16px}
html.embed .foot{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* welcome lesson */
.wipe{position:absolute;top:0;bottom:0;z-index:5;width:0;pointer-events:none}
.wipe::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fffdf7;box-shadow:0 0 0 1px #1912;opacity:.95}
.wipe button{pointer-events:auto;position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:1.5px solid #fff;background:#191a1ee6;color:#fff;font:700 14px var(--mba-mono);box-shadow:0 6px 16px #0004;touch-action:none;cursor:ew-resize}
.side-tag{position:absolute;top:15px;z-index:6;padding:8px 10px;font:10px var(--mba-mono);letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.side-tag.l{left:15px;background:#f3d9c4;color:#3b2a1d}.side-tag.r{right:15px;background:#191a1e;color:#fff}
.brow-pick{position:absolute;z-index:5;transform:translate(-50%,-50%) scale(.625);min-width:40px;height:40px;padding:0 14px;border-radius:22px;border:1.5px solid #fff;background:#f7f5ed;color:#191a1e;font:800 13px var(--mba-mono);letter-spacing:.06em;box-shadow:0 0 0 5px #ffffff54,0 5px 14px #0003}
.brow-pick.sel{background:#191a1e;color:#fff}
.brow-pick.ok{background:#2f3a2e;color:#fff}.brow-pick.no{background:#a8664a;color:#fff}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.pick-row .choice{text-align:center;font-weight:800;letter-spacing:.06em}
.found-list{display:grid;gap:8px;margin:0 0 18px}
.found{border:1px dashed #d6d2ca;padding:12px 14px;font-size:13px;line-height:1.55;color:#8b877f}
.found b{display:block;font:800 11px var(--mba-mono);letter-spacing:.14em;text-transform:uppercase;color:#8b877f;margin-bottom:3px}
.found.on{border:1px solid #9fb19a;background:#eef1ea;color:#3c4a3a}.found.on b{color:#2f3a2e}
.tapzone{cursor:crosshair}
.ping{fill:none;stroke:#fff;stroke-width:2;animation:ping .7s ease-out forwards}
@keyframes ping{from{r:4;opacity:1}to{r:26;opacity:0}}
.mods{display:grid;gap:6px;margin:0 0 18px}
.mod{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fbfaf7;padding:11px 13px;border-radius:2px}
.mod .n{font:11px var(--mba-mono);color:var(--muted)}
.mod .t{font-size:13px;font-weight:800}
.mod .here{font:9.5px var(--mba-mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;padding:3px 6px;opacity:.75}
.mod.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.mod.sel .n{color:#bdb7ad}
.score{font:12px var(--mba-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.done-card{margin-top:24px;padding:25px 30px;border:1px solid #9fb19a;background:#eef1ea;display:flex;justify-content:space-between;gap:20px;align-items:center}
.done-card h3{font-size:clamp(16px,1.6vw,20px);margin:6px 0 7px}.done-card p{font:13px/1.6 var(--mba-mono);color:#4f5a4d;margin:0;max-width:640px}
@media(max-width:480px){.done-card{display:block;padding:20px}.done-card .action{margin-top:16px;width:100%}.wipe button{width:40px;height:40px}.side-tag{font-size:8px;top:10px;padding:7px 8px}.side-tag.l{left:10px}.side-tag.r{right:10px}.brow-pick{height:34px;min-width:34px;padding:0 10px;font-size:11px}}
</style>

  <div class="top"><div class="kicker" id="shellKick"></div><h1 id="shellTitle"></h1><p id="shellSub"></p></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="frame"><div class="inner" id="view" aria-live="polite"></div></div>
  <div class="controls"><button class="control" id="prev" type="button"></button><div class="state" id="state" role="status"></div><button class="control primary" id="next" type="button"></button></div>
  <footer class="foot"><span id="footL"></span><span id="footR"></span></footer>
</div>
<script>/* Shared shell for Mariels Brow Academy interactive lessons (same layout as the free class) */
(function () {
  const params = new URLSearchParams(location.search);
  const EMBED = params.get('embed') === '1';
  if (EMBED) document.documentElement.classList.add('embed');
  let lang = 'en';
  const q = params.get('lang');
  if (q === 'en' || q === 'es') lang = q;
  else { try { const s = localStorage.getItem('mba-lang'); if (s === 'en' || s === 'es') lang = s; } catch (e) {} }

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  window.MBA = {
    EMBED, esc, $,
    get lang() { return lang; },
    start(cfg) {
      const C = cfg;
      let cur = 0;
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(C.key + '-seen') || '[]'); } catch (e) {}
      if (!Array.isArray(seen)) seen = [];
      const view = $('view');

      function T() { return C.T[lang]; }
      function paintShell() {
        const t = T();
        document.documentElement.lang = lang;
        document.title = t.docTitle;
        $('shellKick').textContent = t.shellKick;
        $('shellTitle').innerHTML = t.shellTitle;
        $('shellSub').textContent = t.shellSub;
        $('tabs').setAttribute('aria-label', t.tabsLabel);
        $('tabs').innerHTML = t.tabs.map((tb, i) =>
          `<button class="tab" type="button" data-tab="${i}" ${i === cur ? 'aria-current="step"' : ''}><span class="num">${tb[0]}</span><span class="lbl">${tb[1]}</span><span class="seen">${seen.includes(i) ? t.viewed : ''}</span></button>`).join('');
        $('tabs').querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.tab), true)));
        $('prev').textContent = t.prev;
        $('prev').disabled = cur === 0;
        const nx = $('next');
        if (cur < t.tabs.length - 1) { nx.style.visibility = 'visible'; nx.textContent = t.nextTo + ' ' + t.tabs[cur + 1][1] + ' →'; }
        else { nx.style.visibility = 'hidden'; }
        $('state').textContent = t.part(cur + 1, t.tabs.length) + ' · ' + t.tabs[cur][1];
        $('footL').textContent = t.footL; $('footR').textContent = t.footR;
        document.querySelectorAll('.lang [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      }
      function render() {
        paintShell();
        C.render(cur, view, T(), lang);
        post();
      }
      function go(i, scroll) {
        cur = Math.max(0, Math.min(C.T[lang].tabs.length - 1, i));
        if (!seen.includes(cur)) { seen.push(cur); try { localStorage.setItem(C.key + '-seen', JSON.stringify(seen)); } catch (e) {} }
        render();
        if (scroll) toTabs();
      }
      function toTabs() {
        const tabs = $('tabs');
        try {
          if (EMBED && window.frameElement && window.parent) {
            const fr = window.frameElement.getBoundingClientRect();
            window.parent.scrollTo({ top: window.parent.scrollY + fr.top + tabs.offsetTop - 90, behavior: 'smooth' });
            return;
          }
        } catch (e) {}
        const y = tabs.getBoundingClientRect().top + window.scrollY - 20;
        if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'smooth' });
      }
      $('prev').addEventListener('click', () => go(cur - 1, true));
      $('next').addEventListener('click', () => go(cur + 1, true));
      document.querySelectorAll('.lang [data-lang]').forEach((b) => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        try { localStorage.setItem('mba-lang', lang); } catch (e) {}
        render();
      }));
      MBA.go = (i) => go(i, true);
      MBA.rerender = render;
      MBA.complete = () => {
        try { localStorage.setItem(C.key + '-complete', '1'); } catch (e) {}
        if (EMBED && window.parent !== window) window.parent.postMessage({ type: 'mba-practice-complete', lesson: C.key }, '*');
      };
      go(0, false);
    }
  };

  function post() {
    if (!(EMBED && window.parent !== window)) return;
    window.parent.postMessage({ type: 'mba-practice-height', height: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  }
  MBA.post = post;
  if (EMBED) {
    if ('ResizeObserver' in window) new ResizeObserver(post).observe(document.body);
    window.addEventListener('load', post);
    setTimeout(post, 60);
  }

  /* ---------- drawing helpers ---------- */
  const G = MBA.G = {};
  G.mirror = (p, cx) => [2 * cx - p[0], p[1]];
  /* A brow is drawn from its three mapped points, the way a pro sketches it:
     a soft rounded head, a clean rising top line, a defined arch and a tail that tapers to a point. */
  const interp = (arr, x) => {
    const a = arr.slice().sort((p, q) => p[0] - q[0]);
    if (x <= a[0][0]) return a[0][1];
    if (x >= a[a.length - 1][0]) return a[a.length - 1][1];
    for (let i = 0; i < a.length - 1; i++) if (x <= a[i + 1][0]) { const t = (x - a[i][0]) / (a[i + 1][0] - a[i][0]); return a[i][1] + t * (a[i + 1][1] - a[i][1]); }
  };
  G.brow = (f) => {
    if (f.s) return f;
    const d = f.d, P = f.pts, up = f.up, lo = f.lo;
    const sx = P[0][0], ax = P[1][0];
    const sTop = interp(up, sx) + 0.012 * d, sBot = Math.max(interp(lo, sx), sTop + 0.065 * d);
    const aTop = Math.min(...up.map((p) => p[1])) + 0.01 * d, aBot = Math.max(interp(lo, ax), aTop + 0.06 * d);
    return { d, s: [sx, sTop, sBot + 0.014 * d], a: [ax, aTop, aBot + 0.012 * d], t: [P[2][0], P[2][1]], pts: P };
  };
  G.mirrorBrow = (b, cx) => {
    b = G.brow(b);
    const m = (x) => 2 * cx - x;
    return { d: b.d, s: [m(b.s[0]), b.s[1], b.s[2]], a: [m(b.a[0]), b.a[1], b.a[2]], t: [m(b.t[0]), b.t[1]], pts: b.pts && b.pts.map((p) => [m(p[0]), p[1]]) };
  };
  /* Brow outline in the classic mapping style: a dotted top line and a solid bottom line,
     open at the head, rising to a soft rounded arch and meeting in a sharp point at the tail. */
  G.lines = (b) => {
    b = G.brow(b);
    const d = b.d, dir = b.t[0] > b.s[0] ? 1 : -1, n = (v) => v.toFixed(1);
    const [sx, sT, sB] = b.s, [ax, aT, aB] = b.a, [tx, ty] = b.t;
    const L = Math.abs(tx - sx), aw = Math.abs(tx - ax);
    // top: head → arch (almost straight, gently rising) → rounded shoulder → down to the tail point
    let top = `M${n(sx)},${n(sT)}`;
    top += ` C${n(sx + (ax - sx) * 0.4)},${n(sT + (aT - sT) * 0.45)} ${n(ax - dir * 0.16 * L)},${n(aT)} ${n(ax)},${n(aT)}`;
    top += ` C${n(ax + dir * 0.42 * aw)},${n(aT)} ${n(tx - dir * 0.2 * aw)},${n(ty - 0.35 * (ty - aT))} ${n(tx)},${n(ty)}`;
    // bottom: head → under the arch (almost straight) → softly down to the same tail point
    let bot = `M${n(sx)},${n(sB)}`;
    bot += ` C${n(sx + (ax - sx) * 0.4)},${n(sB + (aB - sB) * 0.45)} ${n(ax - dir * 0.16 * L)},${n(aB)} ${n(ax)},${n(aB)}`;
    bot += ` C${n(ax + dir * 0.4 * aw)},${n(aB)} ${n(tx - dir * 0.22 * aw)},${n(ty - 0.3 * (ty - aB))} ${n(tx)},${n(ty)}`;
    return { top, bot };
  };
  G.path = (b) => { const l = G.lines(b); return l.top + ' ' + l.bot; };
  G.outline = (b, cls, attrs) => {
    const l = G.lines(b);
    return `<path class="${cls} brow-top" ${attrs || ''} d="${l.top}"/><path class="${cls} brow-bot" ${attrs || ''} d="${l.bot}"/>`;
  };
  G.warp = (f, errs) => {
    const b = G.brow(f), d = b.d;
    const s = b.s.slice(), a = b.a.slice(), t = b.t.slice();
    errs.forEach((e) => {
      if (e === 'close') s[0] -= 0.1 * d;
      if (e === 'far') s[0] += 0.1 * d;
      if (e === 'archOut') { a[0] += 0.11 * d; a[1] -= 0.012 * d; a[2] -= 0.008 * d; }
      if (e === 'archIn') { a[0] -= 0.1 * d; a[1] -= 0.006 * d; }
      if (e === 'short') { t[0] -= 0.13 * d; t[1] -= 0.015 * d; }
      if (e === 'long') { t[0] += 0.11 * d; t[1] += 0.07 * d; }
    });
    return { d, s, a, t, pts: [[s[0], (s[1] + s[2]) / 2], [a[0], (a[1] + a[2]) / 2], t] };
  };
  G.side = (f, b, side) => side === 'L' ? G.mirrorBrow(b, f.cx) : b;
  G.pt = (f, p, side) => side === 'L' ? G.mirror(p, f.cx) : p;
  G.len = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  G.ext = (a, p, k) => [p[0] + (p[0] - a[0]) * k, p[1] + (p[1] - a[1]) * k];
  // A mapping string from the anchor through a point, animated
  G.string = (a, p, delay, cls) => {
    const e = G.ext(a, p, 0.14), L = Math.ceil(G.len(a, e)) + 4;
    const st = `style="--len:${L};animation-delay:${delay || 0}s"`;
    return `<line class="str-shadow draw" ${st} x1="${a[0]}" y1="${a[1]}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}"/>` +
      `<line class="str draw ${cls || ''}" ${st} x1="${a[0]}" y1="${a[1]}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}"/>` +
      `<circle class="anchor pop" style="animation-delay:${delay || 0}s" cx="${a[0]}" cy="${a[1]}" r="5"/>` +
      `<circle class="target-ring pop" style="animation-delay:${(delay || 0) + 0.9}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="10"/>` +
      `<circle class="target-dot pop" style="animation-delay:${(delay || 0) + 0.9}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4"/>`;
  };
  G.miss = (from, to, delay) => {
    const s = 7, x = from[0], y = from[1], dl = `style="animation-delay:${delay || 0}s"`;
    return `<g class="pop" ${dl}><line class="gap-line" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${to[0].toFixed(1)}" y2="${to[1].toFixed(1)}"/>` +
      `<line class="miss-x" x1="${(x - s).toFixed(1)}" y1="${(y - s).toFixed(1)}" x2="${(x + s).toFixed(1)}" y2="${(y + s).toFixed(1)}"/>` +
      `<line class="miss-x" x1="${(x - s).toFixed(1)}" y1="${(y + s).toFixed(1)}" x2="${(x + s).toFixed(1)}" y2="${(y - s).toFixed(1)}"/></g>`;
  };
  // zoom: .zoom is scaled 1.6 around 52% 39%
  G.Z = { s: 1.6, ox: 0.52, oy: 0.39 };
  G.toScreen = (x, y) => [((x / 1024 - G.Z.ox) * G.Z.s + G.Z.ox) * 100, ((y / 1024 - G.Z.oy) * G.Z.s + G.Z.oy) * 100];
  G.fromScreen = (fx, fy) => [((fx - G.Z.ox) / G.Z.s + G.Z.ox) * 1024, ((fy - G.Z.oy) / G.Z.s + G.Z.oy) * 1024];
  G.svgPoint = (zoomEl, ev) => {
    const r = zoomEl.getBoundingClientRect();
    return [(ev.clientX - r.left) / r.width * 1024, (ev.clientY - r.top) / r.height * 1024];
  };
})();

  /* ---------------- state ---------------- */
  const S = {
    w: { cur: 0, seen: new Set([0]), wipe: 520, quizOpen: false, quizDone: false },

  try { S.e.finished = localStorage.getItem('mba-welcome-complete') === '1'; } catch (e) {}

  const lfoot = (t, n) => `<footer class="lfoot"><span>${t.lfootL}</span><span>${t.lfootR(n)}</span></footer>`;
  const photo = (img, inner, over, alt) => `<div class="photo-shell" id="shell"><div class="zoom" id="zoom"><img src="${img}" alt="${esc(alt || '')}" draggable="false"><svg viewBox="0 0 1024 1024" preserveAspectRatio="none" id="svg" aria-hidden="true">${inner}</svg>${over || ''}</div></div>`;
  const pctX = (x) => (x / 1024 * 100).toFixed(2) + '%', pctY = (y) => (y / 1024 * 100).toFixed(2) + '%';

  /* ---------------- 01 WATCH ---------------- */
  const FREE_MAIN = G.warp(MAIN, ['close', 'archOut', 'short']);
  function watchSvg(animate) {
    const f = MAIN, k = S.w.cur, X = S.w.wipe;
    let s = `<defs><clipPath id="clipL"><rect id="clipLr" x="0" y="0" width="${X}" height="1024"/></clipPath><clipPath id="clipR"><rect id="clipRr" x="${X}" y="0" width="${1024 - X}" height="1024"/></clipPath></defs>`;
    s += `<g clip-path="url(#clipL)">${G.outline(G.mirrorBrow(FREE_MAIN, f.cx), 'outline-free')}${G.outline(FREE_MAIN, 'outline-free')}</g>`;
    s += `<g clip-path="url(#clipR)">${G.outline(G.mirrorBrow(f, f.cx), 'outline-map')}${G.outline(f, 'outline-map')}</g>`;
    // the string on the mapped brow (viewer's right)
    s += `<g>${G.string(f.a, f.pts[k], 0)}</g>`;
    // where freehand landed on the other brow, and where it should be
    const aL = G.mirror(f.a, f.cx), goodL = G.mirror(f.pts[k], f.cx), badL = G.mirror(FREE_MAIN.pts[k], f.cx);
    s += `<g opacity=".95">${G.string(aL, goodL, 0.25)}</g>`;
    s += G.miss(badL, goodL, 1.2);
    return s;
  }
  function renderWatch(v, t) {
    const w = t.w, it = w.items[S.w.cur], n = S.w.seen.size;
    const sx = G.toScreen(S.w.wipe, 0)[0];
    const hs = MAIN.pts.map((p, i) => `<button type="button" class="hotspot ${i === S.w.cur ? 'is-active' : ''}" data-pt="${i}" style="left:${pctX(p[0])};top:${pctY(p[1] - 30)}" aria-label="${esc(w.items[i].name)}" aria-pressed="${i === S.w.cur}">${i + 1}</button>`).join('');
    v.innerHTML = `
      <p class="lk">${w.kick}</p><h2 class="lt">${w.title}</h2><p class="subtitle">${w.sub}</p>
      <main class="lesson">
        <div class="photo-col">
          ${photo(MAIN.img, watchSvg(), hs, 'Practice face comparing a freehand brow with a mapped brow')}
        </div>
        <section class="panel">
          <div class="panel-head"><span class="eyebrow">${w.eyebrow}</span><span class="counter">0${S.w.cur + 1} / 03</span></div>

      <section class="quiz ${S.w.quizOpen ? 'is-open' : ''}" id="quiz"><strong>${w.qKick}</strong><h3>${w.q}</h3>

    shell.insertAdjacentHTML('beforeend', `<span class="side-tag l">◂ ${w.free}</span><span class="side-tag r">${w.mapped} ▸</span>

      MBA.post();
    }));
    // drag the wipe
    const knob = v.querySelector('#knob'), wipe = v.querySelector('#wipe');
    const setX = (fx) => {
      fx = Math.max(0.02, Math.min(0.98, fx));
      wipe.style.left = (fx * 100) + '%';
      const X = Math.max(0, Math.min(1024, G.fromScreen(fx, 0)[0]));

      const l = v.querySelector('#clipLr'), r = v.querySelector('#clipRr');
      if (l) { l.setAttribute('width', X); r.setAttribute('x', X); r.setAttribute('width', 1024 - X); }
    };
    let drag = false;
    knob.addEventListener('pointerdown', (e) => { drag = true; knob.setPointerCapture(e.pointerId); e.preventDefault(); });
    knob.addEventListener('pointermove', (e) => { if (!drag) return; const r = shell.getBoundingClientRect(); setX((e.clientX - r.left) / r.width); });
    knob.addEventListener('pointerup', () => { drag = false; });
    knob.addEventListener('keydown', (e) => {
      const cur = parseFloat(wipe.style.left) / 100;
      if (e.key === 'ArrowLeft') { setX(cur - 0.04); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setX(cur + 0.04); e.preventDefault(); }
    });
  }

  /* ---------------- 02 TRY ---------------- */
  const ROUNDS = [
    { face: 0, free: 'L', err: 'close' },
    { face: 3, free: 'R', err: 'archOut' },
    { face: 6, free: 'R', err: 'short' },
    { face: 4, free: 'L', err: 'long' }
  ];
  function trySvg(r, answered) {
    const f = face(r.face), fr = G.warp(f, [r.err]);
    const mapSide = r.free === 'L' ? 'R' : 'L';
    const mapB = G.side(f, f, mapSide), freeB = G.side(f, fr, r.free);
    let s = G.outline(mapB, 'outline-map');
    s += G.outline(freeB, answered ? 'outline-free fade' : 'outline-map');
    if (answered) {
      ['L', 'R'].forEach((side, si) => {
        const a = G.pt(f, f.a, side);
        f.pts.forEach((p, i) => { s += G.string(a, G.pt(f, p, side), si * 0.2 + i * 0.35); });
      });
      const idx = { close: 0, far: 0, archOut: 1, archIn: 1, short: 2, long: 2 }[r.err];
      s += G.miss(G.pt(f, fr.pts[idx], r.free), G.pt(f, f.pts[idx], r.free), 1.6);
    }
    return s;
  }
  function renderTry(v, t) {
    const tt = t.t, R = S.t.round, done = S.t.done;
    const score = S.t.picks.filter((p, i) => p === (ROUNDS[i].free === 'L' ? 'B' : 'A')).length;
    const steps = ROUNDS.map((r, i) => {
      const p = S.t.picks[i], ok = p && p === (r.free === 'L' ? 'B' : 'A');
      const cls = i === R && !done ? 'active' : (p ? (ok ? 'done' : 'miss') : '');
      return `<button type="button" class="step ${cls}" data-round="${i}" ${p || i === R ? '' : 'disabled'}><span class="step-num">0${i + 1}</span><span><span class="step-title">${tt.face} 0${i + 1}</span><span class="step-sub">${p ? (ok ? tt.got : tt.missed) : tt.todo}</span></span></button>`;
    }).join('');
    if (done) {
      v.innerHTML = `<p class="lk">${tt.kick}</p><h2 class="lt">${tt.title}</h2><p class="subtitle">${tt.sub}</p>
        <nav class="steps" style="--n:4;--nm:4">${steps}</nav>
        <section class="done-card"><div><span class="eyebrow">${tt.doneK}</span><h3>${tt.doneT(score)}</h3><p>${tt.doneP}</p></div>
        <div class="actions" style="flex-direction:column"><button class="action primary" type="button" id="toFix">${tt.doneBtn}</button><button class="action" type="button" id="again">${tt.again}</button></div></section>
        ${lfoot(t, 2)}`;
      v.querySelector('#toFix').addEventListener('click', () => MBA.go(2));
      v.querySelector('#again').addEventListener('click', () => { S.t = { round: 0, picks: [], done: false }; MBA.rerender(); });
      v.querySelectorAll('[data-round]').forEach((b) => b.addEventListener('click', () => { S.t.done = false; S.t.round = Number(b.dataset.round); MBA.rerender(); }));
      return;
    }
    const r = ROUNDS[R], f = face(r.face), pick = S.t.picks[R], answered = !!pick;
    const right = r.free === 'L' ? 'B' : 'A';
    // label chips above each brow: A = viewer's left, B = viewer's right
    const midR = [(f.up[1][0] + f.up[2][0]) / 2, Math.min(f.up[1][1], f.up[2][1]) - 0.2 * f.d];
    const midL = G.mirror(midR, f.cx);
    const chip = (x, p) => {
      let c = '';
      if (answered) c = x === right ? 'ok' : (x === pick ? 'no' : '');
      return `<button type="button" class="brow-pick ${c}" data-pick="${x}" style="left:${pctX(p[0])};top:${pctY(p[1])}" ${answered ? 'disabled' : ''}>${x}</button>`;
    };
    let fb = '';
    if (answered) {
      const ok = pick === right;
      fb = `<div class="feedback ${ok ? 'correct' : 'wrong'}" role="status"><b>${ok ? tt.yes(right) : tt.no(right)}</b>${tt.why[r.err]}</div>`;
    }
    v.innerHTML = `<p class="lk">${tt.kick}</p><h2 class="lt">${tt.title}</h2><p class="subtitle">${tt.sub}</p>
      <nav class="steps" style="--n:4;--nm:4">${steps}</nav>
      <main class="lesson">
        <div class="photo-col">${photo(f.img, trySvg(r, answered), chip('A', midL) + chip('B', midR), 'Practice face with two brow outlines')}</div>
        <section class="panel">
          <div class="panel-head"><span class="eyebrow">${tt.eyebrow}</span><span class="counter">0${R + 1} / 04</span></div>
          <h2>${tt.title2}</h2><p class="excerpt">${tt.lead}</p><hr class="rule">
          <div class="micro">${tt.pick}</div>
          <div class="pick-row">${['A', 'B'].map((x) => `<button class="choice ${answered ? (x === right ? 'right' : (x === pick ? 'wrong' : '')) : ''}" type="button" data-pick="${x}" ${answered ? 'disabled' : ''}>${tt[x]}</button>`).join('')}</div>
          ${fb}
          <div class="tip"><strong>${tt.tipH}</strong><span>${tt.tip}</span></div>
          <div class="card-bottom">
            <div class="tiny-progress">${ROUNDS.map((_, i) => `<span class="${S.t.picks[i] ? 'done' : ''}"></span>`).join('')}</div>
            <div class="actions"><span class="score" style="align-self:center;margin-right:auto">${tt.score(score, 4)}</span><button class="action primary" type="button" id="nextRound" ${answered ? '' : 'disabled'}>${R < 3 ? tt.next : tt.finish}</button></div>
          </div>
        </section>
      </main>${lfoot(t, 2)}`;
    v.querySelector('#shell').insertAdjacentHTML('beforeend', `<span class="photo-tag">${tt.tag}</span><div class="photo-caption"><span>${tt.capL(R + 1)}</span><span>${tt.capR}</span></div>`);
    v.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => { S.t.picks[R] = b.dataset.pick; MBA.rerender(); }));
    v.querySelector('#nextRound').addEventListener('click', () => {
      const nextOpen = ROUNDS.findIndex((_, i) => !S.t.picks[i]);
      if (nextOpen === -1) S.t.done = true; else S.t.round = nextOpen;
      MBA.rerender();
    });
    v.querySelectorAll('[data-round]').forEach((b) => b.addEventListener('click', () => { S.t.round = Number(b.dataset.round); MBA.rerender(); }));
  }

  /* ---------------- 03 FIX ---------------- */
  const FIXF = face(1), FIXFR = G.warp(FIXF, ['far', 'archIn', 'long']);
  MBA._fix = FIXFR;
  function fixSvg() {
    const f = FIXF, fr = FIXFR;
    let s = G.outline(fr, 'outline-free');
    S.f.found.forEach((on, i) => {
      if (!on) return;
      s += G.string(f.a, f.pts[i], 0);
      s += G.miss(fr.pts[i], f.pts[i], 0.9);
    });
    if (S.f.found.every(Boolean)) s += G.outline(f, 'outline-map fade', 'style="animation-delay:1.4s"');
    s += `<g id="pings"></g><rect class="tapzone" id="tap" x="0" y="0" width="1024" height="1024" fill="transparent" style="pointer-events:all"/>`;
    return s;
  }
  function renderFix(v, t) {
    const ff = t.f, n = S.f.found.filter(Boolean).length, all = n === 3;
    const steps = ff.steps.map((s, i) => `<div class="step ${S.f.found[i] ? 'done' : ''}"><span class="step-num">${S.f.found[i] ? '✓' : '0' + (i + 1)}</span><span><span class="step-title">${s[0]}</span><span class="step-sub">${S.f.found[i] ? ff.found : s[1]}</span></span></div>`).join('');
    const slots = ff.slots.map((s, i) => S.f.found[i]
      ? `<div class="found on"><b>${s.b}</b>${s.p}</div>`
      : `<div class="found"><b>0${i + 1} · ${ff.steps[i][0]}</b>${ff.hidden}</div>`).join('');
    v.innerHTML = `<p class="lk">${ff.kick}</p><h2 class="lt">${ff.title}</h2><p class="subtitle">${ff.sub}</p>
      <nav class="steps" style="--n:3">${steps}</nav>
      <main class="lesson">
        <div class="photo-col">${photo(FIXF.img, fixSvg(), '', 'Practice face with a freehand brow outline')}</div>
        <section class="panel">
          <div class="panel-head"><span class="eyebrow">${ff.eyebrow}</span><span class="counter">${n} / 3</span></div>
          <h2>${ff.title2}</h2><p class="excerpt">${ff.lead}</p><hr class="rule">
          <div class="found-list">${slots}</div>
          <div class="feedback ${S.f.msg ? 'info' : ''}" id="fxfb" role="status">${S.f.msg}</div>
          <div class="tip"><strong>${ff.tipH}</strong><span>${ff.tip}</span></div>
          <div class="card-bottom"><div class="actions">
            <button class="action" type="button" id="hint" ${all ? 'disabled' : ''}>${ff.hint}</button>
            <button class="action" type="button" id="reveal" ${all ? 'disabled' : ''}>${ff.reveal}</button>
            <button class="action" type="button" id="reset">${ff.reset}</button></div></div>
        </section>
      </main>
      ${all ? `<section class="done-card"><div><span class="eyebrow">${ff.doneK}</span><h3>${ff.doneT}</h3><p>${ff.doneP}</p></div><button class="action primary" type="button" id="toExplore">${ff.doneBtn}</button></section>` : ''}
      ${lfoot(t, 3)}`;
    v.querySelector('#shell').insertAdjacentHTML('beforeend', `<span class="photo-tag">${ff.tag}</span><div class="photo-caption"><span>${ff.capL(n)}</span><span>${ff.capR}</span></div>`);
    const zoom = v.querySelector('#zoom');
    v.querySelector('#tap').addEventListener('pointerdown', (ev) => {
      const p = G.svgPoint(zoom, ev);
      const pings = v.querySelector('#pings');
      pings.insertAdjacentHTML('beforeend', `<circle class="ping" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`);
      let hit = -1, best = 1e9;
      FIXFR.pts.forEach((q, i) => { const dd = G.len(p, q); if (!S.f.found[i] && dd < 0.2 * FIXF.d && dd < best) { best = dd; hit = i; } });
      if (hit >= 0) { S.f.found[hit] = true; S.f.msg = ''; MBA.rerender(); }
      else { const fb = v.querySelector('#fxfb'); fb.className = 'feedback wrong'; fb.textContent = ff.miss; }
    });
    v.querySelector('#hint').addEventListener('click', () => {
      const i = S.f.found.findIndex((x) => !x); if (i < 0) return;
      const fb = v.querySelector('#fxfb'); fb.className = 'feedback info'; fb.textContent = ff.hintText[i];
      const p = FIXFR.pts[i];
      v.querySelector('#pings').insertAdjacentHTML('beforeend', `<circle class="ping" cx="${p[0]}" cy="${p[1]}" r="4" style="animation-iteration-count:3"/>`);
    });
    v.querySelector('#reveal').addEventListener('click', () => { S.f.found = [true, true, true]; S.f.msg = ''; MBA.rerender(); });
    v.querySelector('#reset').addEventListener('click', () => { S.f.found = [false, false, false]; S.f.msg = ''; MBA.rerender(); });
    const te = v.querySelector('#toExplore'); if (te) te.addEventListener('click', () => MBA.go(3));
  }

  /* ---------------- 04 EXPLORE ---------------- */
  function exploreSvg() {
    const f = MAIN;
    let s = G.outline(f, 'outline-map fade') + G.outline(G.mirrorBrow(f, f.cx), 'outline-map fade');
    ['R', 'L'].forEach((side, si) => {
      const a = G.pt(f, f.a, side);
      f.pts.forEach((p, i) => { s += G.string(a, G.pt(f, p, side), si * 0.15 + i * 0.3); });
    });
    return s;
  }
  function renderExplore(v, t) {
    const e = t.e, m = e.mods[S.e.mod];
    v.innerHTML = `<p class="lk">${e.kick}</p><h2 class="lt">${e.title}</h2><p class="subtitle">${e.sub}</p>
      <main class="lesson">
        <div class="photo-col">${photo(MAIN.img, exploreSvg(), '', 'Practice face with a finished brow map')}</div>
        <section class="panel">
          <div class="panel-head"><span class="eyebrow">${e.eyebrow}</span><span class="counter">0${S.e.mod + 1} / 05</span></div>
          <h2>${m.t}</h2><p class="excerpt">${m.d}</p><hr class="rule">
          <div class="mods">${e.mods.map((x, i) => `<button type="button" class="mod ${i === S.e.mod ? 'sel' : ''}" data-mod="${i}"><span class="n">${e.modK} ${x.n}</span><span class="t">${x.t}</span>${i === 0 ? `<span class="here">${e.here}</span>` : '<span></span>'}</button>`).join('')}</div>
          <div class="card-bottom"><div class="tiny-progress">${e.mods.map((_, i) => `<span class="${i === 0 ? 'done' : ''}"></span>`).join('')}</div></div>
        </section>
      </main>
      <section class="practice"><div><h3>${e.pTitle}</h3><p>${e.pText}</p></div><button class="action primary" type="button" id="finish" ${S.e.finished ? 'disabled' : ''}>${S.e.finished ? e.finished : e.finish}</button></section>
      ${lfoot(t, 4)}`;
    v.querySelector('#shell').insertAdjacentHTML('beforeend', `<span class="photo-tag">${e.tag}</span><div class="photo-caption"><span>${e.modK} ${m.n} · ${m.t}</span><span>${e.capR}</span></div>`);
    v.querySelectorAll('[data-mod]').forEach((b) => b.addEventListener('click', () => { S.e.mod = Number(b.dataset.mod); MBA.rerender(); }));
    v.querySelector('#finish').addEventListener('click', () => { S.e.finished = true; MBA.complete(); MBA.rerender(); });
  }

  MBA.start({
    key: 'mba-welcome', T,
    render(i, v, t) { [renderWatch, renderTry, renderFix, renderExplore][i](v, t); }
  });
})();
</script>
</body>
</html>
